<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyfurion Holder Lounge</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080809;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
    }
    #canvas-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }
    #hud h1 {
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #00E5FF;
      text-shadow: 0 0 16px #00E5FF88;
    }
    #time-controls {
      margin-top: 12px;
      display: inline-flex;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(8, 12, 20, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.14);
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }
    .time-btn {
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      color: #eaf7ff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .time-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
    }
    .time-btn.active {
      border-color: rgba(0, 229, 255, 0.9);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.35) inset;
      background: rgba(0, 229, 255, 0.18);
      color: #d8fdff;
    }
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #080809;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #00E5FF;
      font-family: 'Space Grotesk', sans-serif;
    }
    #loading .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(0,229,255,0.2);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { letter-spacing: 0.15em; font-size: 1rem; text-transform: uppercase; }
    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Caricamento stanza...</p>
  </div>

  <div id="hud">
    <h1>Holder Lounge</h1>
    <div id="time-controls" aria-label="Selettore paesaggio">
      <button class="time-btn active" data-time="alba">Alba</button>
      <button class="time-btn" data-time="mezzogiorno">Mezzogiorno</button>
      <button class="time-btn" data-time="mezzanotte">Mezzanotte</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <div id="hint">Trascina per guardarti attorno a 360°</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { Sky } from 'three/addons/objects/Sky.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // --- Scene setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.physicallyCorrectLights = true;
    container.appendChild(renderer.domElement);
    scene.fog = new THREE.FogExp2(0x1b263f, 0.0035);
    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    // --- Environment map per riflessi realistici (asincrono, dopo il caricamento) ---
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const envTexture = pmremGenerator.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    scene.environment = envTexture;

    // --- Cielo realistico + nuvole animate ---
    const sky = new Sky();
    sky.scale.setScalar(850);
    scene.add(sky);
    const skyUniforms = sky.material.uniforms;

    const cloudMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.BackSide,
      uniforms: {
        uTime: { value: 0 },
        uDensity: { value: 0.35 },
        uColor: { value: new THREE.Color('#ffffff') }
      },
      vertexShader: `
        varying vec3 vPos;
        void main() {
          vPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vPos;
        uniform float uTime;
        uniform float uDensity;
        uniform vec3 uColor;

        float n(vec2 p){
          return sin(p.x)*sin(p.y);
        }

        void main() {
          vec2 uv = normalize(vPos.xz) * 3.0;
          float t = uTime * 0.03;
          float f = 0.0;
          f += n((uv + vec2(t, 0.0)) * 2.0) * 0.5 + 0.5;
          f += n((uv + vec2(-t * 0.8, t * 0.5)) * 4.2) * 0.25 + 0.25;
          f += n((uv + vec2(t * 0.3, -t)) * 7.3) * 0.125 + 0.125;
          float cloud = smoothstep(0.72, 1.12, f) * uDensity;
          gl_FragColor = vec4(uColor, cloud * 0.75);
        }
      `
    });
    const cloudDome = new THREE.Mesh(new THREE.SphereGeometry(800, 64, 32), cloudMaterial);
    scene.add(cloudDome);

    const sunDisc = new THREE.Mesh(
      new THREE.SphereGeometry(1.8, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xffe4b5, transparent: true, opacity: 0.95 })
    );
    scene.add(sunDisc);

    const moonDisc = new THREE.Mesh(
      new THREE.SphereGeometry(1.35, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xcfe8ff, transparent: true, opacity: 0.0 })
    );
    scene.add(moonDisc);

    const starCount = 280;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 0.45;
      const r = 420;
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.cos(phi);
      starPositions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    const starsGeom = new THREE.BufferGeometry();
    starsGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMat = new THREE.PointsMaterial({
      color: 0xcfe4ff,
      size: 1.6,
      transparent: true,
      opacity: 0.0,
      depthWrite: false
    });
    const stars = new THREE.Points(starsGeom, starsMat);
    scene.add(stars);

    // --- Lights ---
    // Luce principale (simula luce neon ad anello come in Blender)
    const ringLight = new THREE.PointLight(0xffffff, 1.2, 30);
    ringLight.position.set(0, 3.5, 0);
    ringLight.castShadow = true;
    ringLight.shadow.mapSize.width = 2048;
    ringLight.shadow.mapSize.height = 2048;
    ringLight.shadow.camera.near = 0.1;
    ringLight.shadow.camera.far = 20;
    ringLight.shadow.bias = -0.001;
    ringLight.shadow.normalBias = 0.02;
    ringLight.shadow.radius = 2;
    scene.add(ringLight);

    // Luce ambient neutra
    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);

    // Luce fill fredda da finestre
    const windowLight1 = new THREE.DirectionalLight(0xb0d4ff, 0.5);
    windowLight1.position.set(6, 4, 0);
    windowLight1.castShadow = false;
    scene.add(windowLight1);

    const windowLight2 = new THREE.DirectionalLight(0xb0d4ff, 0.4);
    windowLight2.position.set(-6, 4, 0);
    scene.add(windowLight2);

    // Luce dal basso per il riflesso del pavimento marmo
    const floorBounce = new THREE.HemisphereLight(0xddeeff, 0x1a1a2e, 0.4);
    scene.add(floorBounce);

    const moonFillLight = new THREE.DirectionalLight(0x8cbcff, 0.0);
    moonFillLight.position.set(-5, 7, -5);
    scene.add(moonFillLight);

    const moodLight = new THREE.PointLight(0x4cc7ff, 0.0, 14);
    moodLight.position.set(0, 1.8, -1.8);
    scene.add(moodLight);

    const skyPresetTargets = {
      alba: {
        turbidity: 2.5, rayleigh: 1.2, mie: 0.0055, mieG: 0.88, sunElev: 6.0, sunAz: 116,
        cloudColor: '#ffd9bf', cloudStrength: 0.42,
        ring: 0.95, ambient: 0.35, ambientColor: '#ffd8bc',
        w1: 0.62, w2: 0.5, windowColor: '#ffb48e',
        bounce: 0.3, bounceSky: '#ffd3be', bounceGround: '#34231e',
        moon: 0.0, mood: 0.0,
        fogColor: '#3a2c33', fogDensity: 0.0046,
        exposure: 0.97, moonAlpha: 0.0, starAlpha: 0.0
      },
      mezzogiorno: {
        turbidity: 1.6, rayleigh: 2.3, mie: 0.003, mieG: 0.8, sunElev: 42, sunAz: 182,
        cloudColor: '#f5fbff', cloudStrength: 0.22,
        ring: 0.65, ambient: 0.55, ambientColor: '#eef7ff',
        w1: 0.95, w2: 0.9, windowColor: '#e8f7ff',
        bounce: 0.55, bounceSky: '#d8ecff', bounceGround: '#9eb3c2',
        moon: 0.0, mood: 0.0,
        fogColor: '#b8d5ef', fogDensity: 0.0028,
        exposure: 1.12, moonAlpha: 0.0, starAlpha: 0.0
      },
      mezzanotte: {
        turbidity: 8.0, rayleigh: 0.18, mie: 0.017, mieG: 0.95, sunElev: -8.0, sunAz: 260,
        cloudColor: '#89a0c7', cloudStrength: 0.3,
        ring: 1.25, ambient: 0.18, ambientColor: '#87a4cf',
        w1: 0.2, w2: 0.16, windowColor: '#87a9ff',
        bounce: 0.14, bounceSky: '#6a85b5', bounceGround: '#0c1220',
        moon: 0.78, mood: 0.72,
        fogColor: '#0b1020', fogDensity: 0.0058,
        exposure: 0.86, moonAlpha: 0.95, starAlpha: 0.92
      }
    };

    let activePreset = 'alba';
    let targetPreset = skyPresetTargets[activePreset];
    const sunDirection = new THREE.Vector3();
    const windowMaterials = [];
    const emissiveMaterials = [];
    const tmpColor = new THREE.Color();

    function setActivePreset(name) {
      activePreset = name;
      targetPreset = skyPresetTargets[name];
      const buttons = document.querySelectorAll('.time-btn');
      buttons.forEach((btn) => btn.classList.toggle('active', btn.dataset.time === name));
    }

    document.querySelectorAll('.time-btn').forEach((btn) => {
      btn.addEventListener('click', () => setActivePreset(btn.dataset.time));
    });

    function lerpColorHex(color, targetHex, t) {
      tmpColor.set(targetHex);
      color.lerp(tmpColor, t);
    }

    function sunPositionFromAngles(elevDeg, azDeg) {
      const phi = THREE.MathUtils.degToRad(90 - elevDeg);
      const theta = THREE.MathUtils.degToRad(azDeg);
      sunDirection.setFromSphericalCoords(1, phi, theta);
      return sunDirection;
    }

    // --- Look-around da punto fisso (prima persona) ---
    let yaw = 0;
    let pitch = 0;
    let isDragging = false;
    let lastX = 0, lastY = 0;
    const sensitivity = 0.003;

    renderer.domElement.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      renderer.domElement.style.cursor = 'grabbing';
    });
    window.addEventListener('mouseup', () => {
      isDragging = false;
      renderer.domElement.style.cursor = 'grab';
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      yaw   -= dx * sensitivity;
      pitch -= dy * sensitivity;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
    });

    renderer.domElement.addEventListener('touchstart', (e) => {
      isDragging = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    });
    window.addEventListener('touchend', () => { isDragging = false; });
    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      yaw   -= dx * sensitivity;
      pitch -= dy * sensitivity;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
    });

    renderer.domElement.style.cursor = 'grab';

    // --- CubeCamera per specchio reale ---
    const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(512, {
      format: THREE.RGBAFormat,
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter
    });
    const cubeCamera = new THREE.CubeCamera(0.1, 100, cubeRenderTarget);
    scene.add(cubeCamera);
    let mirrorMeshes = []; // lista mesh specchio da nascondere durante il render cube

    // --- Load GLB ---
    const loader = new GLTFLoader();
    loader.load(
      './stanza NYF.glb',
      (gltf) => {
        const model = gltf.scene;

        // Abilita shadow e migliora materiali su ogni mesh
        model.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            if (node.material) {
              const materials = Array.isArray(node.material) ? node.material : [node.material];
              for (const mat of materials) {
                if (!mat) continue;

                // Mesh "cubo" con materiale "mirror" -> specchio reale con CubeCamera
                const nomeMesh = node.name.toLowerCase();
                const nomeMat = mat.name ? mat.name.toLowerCase() : '';
                const nomeParent = node.parent ? node.parent.name.toLowerCase() : '';

                if ((nomeMesh.includes('cubo') || nomeParent.includes('cubo')) && nomeMat.includes('mirror')) {
                  // Posiziona la CubeCamera al centro della mesh specchio
                  const meshBox = new THREE.Box3().setFromObject(node);
                  const meshCenter = meshBox.getCenter(new THREE.Vector3());
                  cubeCamera.position.copy(meshCenter);

                  // Applica materiale specchio perfetto
                  mat.envMap = cubeRenderTarget.texture;
                  mat.envMapIntensity = 1.0;
                  mat.roughness = 0.0;
                  mat.metalness = 1.0;
                  mat.color.set(0xffffff);
                  mat.needsUpdate = true;
                  mirrorMeshes.push(node);
                } else if (nomeMesh.includes('finestra') || nomeParent.includes('finestra')) {
                  mat.transparent = true;
                  mat.opacity = 1.0;
                  mat.roughness = 0.02;
                  mat.metalness = 0.0;
                  mat.color.set(0xe6f3ff);
                  mat.depthWrite = false;
                  mat.side = THREE.DoubleSide;
                  if ('transmission' in mat) {
                    mat.transmission = 0.97;
                    mat.ior = 1.45;
                    mat.thickness = 0.05;
                    mat.envMapIntensity = 1.0;
                  }
                  windowMaterials.push(mat);
                } else {
                  // Tuning PBR globale senza cambiare texture originale
                  if (mat.opacity < 1.0 || mat.transparent === true || mat.alphaTest > 0) {
                    mat.transparent = true;
                    mat.depthWrite = false;
                    mat.side = THREE.DoubleSide;
                  }
                  if ('envMapIntensity' in mat) {
                    mat.envMapIntensity = Math.max(mat.envMapIntensity || 0.0, 1.12);
                  }
                  if ('roughness' in mat) {
                    mat.roughness = THREE.MathUtils.clamp(mat.roughness, 0.08, 0.95);
                  }
                  if ('metalness' in mat) {
                    mat.metalness = THREE.MathUtils.clamp(mat.metalness, 0.0, 1.0);
                  }
                  if ('clearcoat' in mat) {
                    mat.clearcoat = Math.max(mat.clearcoat || 0.0, 0.08);
                    mat.clearcoatRoughness = Math.min(mat.clearcoatRoughness ?? 0.35, 0.45);
                  }
                }

                // Migliora dettaglio texture (ultra quality sampling)
                const texList = [
                  mat.map,
                  mat.normalMap,
                  mat.roughnessMap,
                  mat.metalnessMap,
                  mat.aoMap,
                  mat.emissiveMap,
                  mat.alphaMap
                ];
                for (const tex of texList) {
                  if (!tex) continue;
                  tex.anisotropy = maxAnisotropy;
                  tex.minFilter = THREE.LinearMipmapLinearFilter;
                  tex.magFilter = THREE.LinearFilter;
                  tex.generateMipmaps = true;
                }

                if (mat.map) mat.map.colorSpace = THREE.SRGBColorSpace;
                if (mat.emissiveMap) mat.emissiveMap.colorSpace = THREE.SRGBColorSpace;
                if (mat.normalMap && mat.normalScale) {
                  mat.normalScale.set(1.0, 1.0);
                }
                mat.dithering = true;

                if (mat.emissive && (mat.emissiveMap || mat.emissiveIntensity > 0)) {
                  emissiveMaterials.push(mat);
                }
                mat.needsUpdate = true;
              }
            }
          }
        });

        // Centra il modello
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        scene.add(model);

        // Posiziona camera esattamente sul nodo pivot
        const pivotNode = model.getObjectByName('pivot');
        const camPos = new THREE.Vector3(0, 0, 0);
        if (pivotNode) {
          pivotNode.getWorldPosition(camPos);
          camPos.y += 0.6;
        }
        camera.position.copy(camPos);

        // Aggiorna la posizione della luce ring sul soffitto reale
        const modelBox = new THREE.Box3().setFromObject(model);
        const modelSize = modelBox.getSize(new THREE.Vector3());
        ringLight.position.set(camPos.x, camPos.y + modelSize.y * 0.35, camPos.z);

        document.getElementById('loading').style.display = 'none';
      },
      (xhr) => {
        const pct = Math.round((xhr.loaded / xhr.total) * 100);
        const p = document.querySelector('#loading p');
        if (p) p.textContent = `Caricamento stanza... ${pct}%`;
      },
      (err) => {
        console.error('Errore caricamento GLB:', err);
        const p = document.querySelector('#loading p');
        if (p) p.textContent = 'Errore nel caricamento';
      }
    );

    // --- Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animate: ruota camera attorno al punto fisso ---
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      // Transizione smooth tra i 3 preset
      const mixSpeed = 0.03;

      skyUniforms.turbidity.value = THREE.MathUtils.lerp(skyUniforms.turbidity.value, targetPreset.turbidity, mixSpeed);
      skyUniforms.rayleigh.value = THREE.MathUtils.lerp(skyUniforms.rayleigh.value, targetPreset.rayleigh, mixSpeed);
      skyUniforms.mieCoefficient.value = THREE.MathUtils.lerp(skyUniforms.mieCoefficient.value, targetPreset.mie, mixSpeed);
      skyUniforms.mieDirectionalG.value = THREE.MathUtils.lerp(skyUniforms.mieDirectionalG.value, targetPreset.mieG, mixSpeed);

      cloudMaterial.uniforms.uTime.value = elapsed;
      cloudMaterial.uniforms.uDensity.value = THREE.MathUtils.lerp(
        cloudMaterial.uniforms.uDensity.value,
        targetPreset.cloudStrength,
        mixSpeed
      );
      lerpColorHex(cloudMaterial.uniforms.uColor.value, targetPreset.cloudColor, mixSpeed);
      cloudDome.rotation.y += 0.00028;

      const sunAnim = Math.sin(elapsed * 0.06) * 2.2;
      const azAnim = Math.sin(elapsed * 0.03) * 4.0;
      const sunPos = sunPositionFromAngles(targetPreset.sunElev + sunAnim, targetPreset.sunAz + azAnim);
      skyUniforms.sunPosition.value.copy(sunPos);

      sunDisc.position.set(sunPos.x * 260, Math.max(8, sunPos.y * 240), sunPos.z * 260);
      moonDisc.position.set(-sunPos.x * 290, Math.max(12, -sunPos.y * 210 + 35), -sunPos.z * 290);
      moonFillLight.position.copy(moonDisc.position).normalize().multiplyScalar(9);
      stars.rotation.y += 0.00008;

      renderer.toneMappingExposure = THREE.MathUtils.lerp(renderer.toneMappingExposure, targetPreset.exposure, mixSpeed);
      lerpColorHex(scene.fog.color, targetPreset.fogColor, mixSpeed);
      scene.fog.density = THREE.MathUtils.lerp(scene.fog.density, targetPreset.fogDensity, mixSpeed);

      ringLight.intensity = THREE.MathUtils.lerp(ringLight.intensity, targetPreset.ring, mixSpeed);
      lerpColorHex(ringLight.color, targetPreset.windowColor, mixSpeed * 0.35);

      ambient.intensity = THREE.MathUtils.lerp(ambient.intensity, targetPreset.ambient, mixSpeed);
      lerpColorHex(ambient.color, targetPreset.ambientColor, mixSpeed);

      windowLight1.intensity = THREE.MathUtils.lerp(windowLight1.intensity, targetPreset.w1, mixSpeed);
      windowLight2.intensity = THREE.MathUtils.lerp(windowLight2.intensity, targetPreset.w2, mixSpeed);
      lerpColorHex(windowLight1.color, targetPreset.windowColor, mixSpeed);
      lerpColorHex(windowLight2.color, targetPreset.windowColor, mixSpeed);

      floorBounce.intensity = THREE.MathUtils.lerp(floorBounce.intensity, targetPreset.bounce, mixSpeed);
      lerpColorHex(floorBounce.color, targetPreset.bounceSky, mixSpeed);
      lerpColorHex(floorBounce.groundColor, targetPreset.bounceGround, mixSpeed);

      moonFillLight.intensity = THREE.MathUtils.lerp(moonFillLight.intensity, targetPreset.moon, mixSpeed);
      moodLight.intensity = THREE.MathUtils.lerp(moodLight.intensity, targetPreset.mood, mixSpeed);
      lerpColorHex(moodLight.color, targetPreset.windowColor, mixSpeed * 0.5);

      moonDisc.material.opacity = THREE.MathUtils.lerp(moonDisc.material.opacity, targetPreset.moonAlpha, mixSpeed);
      stars.material.opacity = THREE.MathUtils.lerp(stars.material.opacity, targetPreset.starAlpha, mixSpeed);

      for (let i = 0; i < windowMaterials.length; i++) {
        const mat = windowMaterials[i];
        mat.envMapIntensity = THREE.MathUtils.lerp(mat.envMapIntensity || 1.0, targetPreset.moon > 0 ? 1.35 : 0.95, mixSpeed);
        if ('attenuationColor' in mat) {
          tmpColor.set(targetPreset.windowColor);
          mat.attenuationColor.lerp(tmpColor, mixSpeed);
        }
      }

      for (let i = 0; i < emissiveMaterials.length; i++) {
        const mat = emissiveMaterials[i];
        mat.emissiveIntensity = THREE.MathUtils.lerp(
          mat.emissiveIntensity || 1.0,
          targetPreset.moon > 0 ? 1.18 : (activePreset === 'alba' ? 0.92 : 0.78),
          mixSpeed
        );
      }

      euler.set(pitch, yaw, 0, 'YXZ');
      camera.quaternion.setFromEuler(euler);

      // Aggiorna specchio: nascondi le mesh mirror, renderizza scena nel cubeCamera, ripristina
      if (mirrorMeshes.length > 0) {
        mirrorMeshes.forEach(m => m.visible = false);
        cubeCamera.update(renderer, scene);
        mirrorMeshes.forEach(m => m.visible = true);
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
