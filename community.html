<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Community Nyfurion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        html, body {
            margin:0; padding:0; width:100vw; height:100vh;
            background:#0b101a; color:#eaffd0;
            font-family:'Orbitron',sans-serif;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        body { min-height:100vh; }
        .nyf-root { display:flex; flex-direction:column; height:100vh; }
        .nyf-header {
            background:linear-gradient(90deg,#1bff6a 0%,#00eaff 100%);
            color:#181a22; font-weight:bold; font-size:1.2em;
            padding:1em 2em; display:flex; align-items:center; justify-content:space-between;
            box-sizing:border-box;
        }
        .nyf-header .nyf-user { display:flex; align-items:center; gap:0.7em; }
        .nyf-avatar { width:38px; height:38px; border-radius:50%; object-fit:cover; border:2px solid #fff; }
        .nyf-main { flex:1 1 0; display:flex; min-height:0; }
        .nyf-sidebar {
            width:220px; background:#181a22; border-right:2px solid #1bff6a22;
            padding:1.2em 0.5em; display:flex; flex-direction:column; gap:1.2em;
        }
        .nyf-sidebar-title { color:#1bff6a; font-size:1.08em; font-weight:bold; margin-bottom:0.7em; }
        .nyf-section-list { list-style:none; padding:0; margin:0; }
        .nyf-section-btn {
            width:100%; background:none; border:none; color:#bafff7; font-size:1em;
            text-align:left; padding:0.5em 0.7em; border-radius:7px; cursor:pointer;
            transition:background 0.15s, color 0.15s; font-family:inherit;
        }
        .nyf-section-btn.active, .nyf-section-btn:hover {
            background:linear-gradient(90deg,#1bff6a22 0%,#00eaff22 100%);
            color:#1bff6a;
        }
        .nyf-chat-area { flex:1 1 0; display:flex; flex-direction:column; min-width:0; }
        .nyf-chatbox {
            flex:1 1 0; background:rgba(24,26,34,0.93); border-radius:12px;
            margin:1em 1.2em 0.5em 1.2em; box-shadow:0 0 12px #00eaff11;
            overflow-y:auto; display:flex; flex-direction:column;
            padding:1em 1em 0.5em 1em; min-height:0;
            max-width:100vw; box-sizing:border-box;
        }
        .nyf-message { margin-bottom:0.7em; display:flex; align-items:flex-end; gap:0.7em; }
        .nyf-message-content { max-width:60vw; min-width:0; display:flex; flex-direction:column; }
        .nyf-message .meta { font-size:0.93em; color:#bafff7; font-weight:600; margin-bottom:0.1em; display:flex; align-items:center; gap:0.4em; }
        .nyf-message .meta .date { color:#7ee7c7; font-size:0.85em; font-weight:normal; }
        .nyf-message .text { color:#fff; background:rgba(35,42,58,0.93); border-radius:7px; padding:0.45em 0.9em; font-size:1em; margin-top:0.1em; word-break:break-word; box-shadow:0 0 6px #00eaff11; border:1px solid #1bff6a22; }
        .nyf-message .attachments { margin-top:0.3em; }
        .nyf-message .attachments img { max-width:120px; max-height:120px; border-radius:8px; margin-right:0.4em; margin-bottom:0.2em; border:1px solid #232a3a; }
        .nyf-form-wrap { width:100%; display:flex; justify-content:center; align-items:flex-end; margin:0 0 0.5em 0; }
        .nyf-form {
            display:flex; gap:0.4em; align-items:center; width:100%; max-width:700px;
            background:rgba(24,26,34,0.98); border-radius:8px; box-shadow:0 0 6px #00eaff11;
            padding:0.4em 0.7em; box-sizing:border-box;
        }
        .nyf-form input[type="text"] {
            border-radius:6px; border:1px solid #1bff6a; background:#181a22; color:#fff;
            font-size:1em; padding:0.45em 0.8em; font-family:inherit; outline:none; flex:1 1 auto;
        }
        .nyf-btn {
            background:linear-gradient(90deg,#00eaff 0%,#1bff6a 100%);
            color:#181a22; font-family:'Orbitron',sans-serif; font-size:1em; font-weight:bold;
            padding:0.45em 1em; border-radius:8px; border:none; box-shadow:0 0 6px #00eaff22;
            cursor:pointer; transition:background 0.18s, color 0.18s, transform 0.18s;
        }
        .nyf-btn:hover, .nyf-btn:focus {
            background:linear-gradient(90deg,#1bff6a 0%,#00eaff 100%);
            color:#fff; transform:scale(1.04);
        }
        .nyf-form input[type="file"] { display:none; }
        .nyf-emoji-btn { background:none; border:none; font-size:1.3em; cursor:pointer; margin-right:0.2em; }
        .nyf-profile-modal-bg { position:fixed; left:0; top:0; width:100vw; height:100vh; background:rgba(10,18,28,0.97); z-index:200; display:flex; align-items:center; justify-content:center; }
        .nyf-profile-modal { background:#181a22; border-radius:18px; box-shadow:0 0 32px #00eaff33; padding:2em 2em 1.5em 2em; max-width:350px; width:96vw; color:#fff; text-align:center; position:relative; }
        .nyf-profile-modal input[type="text"] { width:90%; margin:0.7em 0; padding:0.5em 1em; border-radius:10px; border:1.5px solid #1bff6a; background:#232a3a; color:#fff; font-size:1.1em; }
        .nyf-profile-modal input[type="file"] { margin:0.7em 0; }
        .nyf-profile-modal img { width:80px; height:80px; border-radius:50%; object-fit:cover; margin-bottom:0.7em; border:2px solid #1bff6a; }
        .nyf-profile-modal .nyf-btn { margin-top:1em; }
        /* --- Responsive --- */
        @media (max-width:900px) {
            .nyf-sidebar { width:120px; font-size:0.93em; padding:0.7em 0.2em; }
            .nyf-header { font-size:1em; padding:0.7em 0.7em; }
        }
        @media (max-width:700px) {
            .nyf-root { height:auto; min-height:100vh; }
            .nyf-header {
                font-size:1em;
                padding:0.5em 0.3em;
                flex-direction:row;
                align-items:center;
                justify-content:space-between;
                gap:0;
                width:100vw;
                box-sizing:border-box;
            }
            .nyf-sidebar, .nyf-sidebar-title, .nyf-section-list { display: none !important; }
            /* RIMOSSO: .nyf-section-mobile-btn { display: none !important; } */
            #nyf-wallet-visible {
                display: none !important;
            }
            .nyf-main { flex-direction:column; width:100vw; min-width:0; }
            .nyf-chat-area { min-width:0; width:100vw; }
            .nyf-chatbox {
                margin:7em 0 0.1em 0; /* Sposta la chat ancora più in basso su mobile */
                padding:0.18em 0.03em 0.1em 0.03em;
                font-size:1em;
                border-radius:7px;
                min-height:60vh;      /* aumentato */
                max-height:80vh;      /* aumentato */
                width:100vw;
                box-sizing:border-box;
            }
            .nyf-form-wrap { margin:5em 0 0.04em 0; } /* Sposta la barra messaggi ancora più in basso */
            .nyf-form {
                max-width:100vw;
                width:100vw;
                padding:0.12em 0.01em;
                gap:0.1em;
                border-radius:7px;
                box-sizing:border-box;
            }
            .nyf-form input[type="text"] {
                font-size:1em;
                padding:0.22em 0.4em;
                border-radius:6px;
                width:100%;
                box-sizing:border-box;
            }
            .nyf-btn {
                font-size:1em;
                padding:0.18em 0.6em;
                border-radius:7px;
            }
            .nyf-avatar { width:20px; height:20px; }
            .nyf-message .attachments img { max-width:38vw; max-height:38vw; }
            /* MOSTRA LE CATEGORIE MOBILE E RENDILE VISIBILI */
            #nyf-categories-mobile {
                display: block !important;
                background: #181a22;
                border-radius: 10px;
                margin: 0.7em 0.5em 0.2em 0.5em;
                padding: 0.5em 0.2em;
                box-shadow: 0 0 8px #00eaff22;
            }
        }
        /* Mostra sempre il bottone menu mobile su mobile */
        @media (max-width:500px) {
            .nyf-section-mobile-btn {
                display: flex !important;
                position: fixed !important;
                top: 2.9em !important; /* Spostato più giù */
                right: 0.7em !important;
                left: auto !important;
                z-index: 3000 !important;
                margin: 0 !important;
            }
        }
        @media (max-width:500px) {
            .nyf-header { font-size:0.97em; padding:0.09em 0.01em; }
            .nyf-section-btn { font-size:0.97em; min-width:48px; padding:0.13em 0.18em; }
            .nyf-avatar { width:14px; height:14px; }
            .nyf-chatbox { font-size:0.97em; min-height:30vh; max-height:45vh; }
            .nyf-message-content { max-width:99vw; }
        }
        @media (max-width:400px) {
            .nyf-header { font-size:0.93em; }
            .nyf-section-btn { font-size:0.93em; min-width:32px; }
            .nyf-chatbox { font-size:0.93em; }
        }
        /* Mobile popup */
        .nyf-section-mobile-btn {
            display: none;
            position: fixed;
            top: 0.5em;
            left: 0.5em;
            z-index: 1001;
            background: linear-gradient(90deg,#1bff6a 0%,#00eaff 100%);
            color: #181a22;
            font-family: 'Orbitron',sans-serif;
            font-size: 1.1em;
            font-weight: bold;
            padding: 0.5em 1.2em 0.5em 1.2em;
            border-radius: 18px;
            border: none;
            box-shadow: 0 0 12px #00eaff33;
            cursor: pointer;
            align-items: center;
            gap: 0.7em;
        }
        .nyf-section-popup-bg {
            display: none;
            position: fixed;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(10,18,28,0.97);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .nyf-section-popup {
            background: #181a22;
            border-radius: 18px;
            box-shadow: 0 0 32px #00eaff33;
            padding: 1.2em 0.7em 1em 0.7em;
            max-width: 95vw;
            width: 320px;
            color: #fff;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 0.5em;
        }
        .nyf-section-popup .nyf-section-btn {
            display: block;
            width: 100%;
            margin: 0.2em 0;
            font-size: 1.08em;
            border-radius: 10px;
            padding: 0.7em 0.5em;
            text-align: center;
            border-bottom: none;
            background: linear-gradient(90deg,#232a3a 0%,#181a22 100%);
            color: #bafff7;
            border: 1.5px solid #1bff6a22;
            transition: background 0.15s, color 0.15s, border 0.15s;
        }
        .nyf-section-popup .nyf-section-btn.active,
        .nyf-section-popup .nyf-section-btn:focus,
        .nyf-section-popup .nyf-section-btn:hover {
            background: linear-gradient(90deg,#1bff6a22 0%,#00eaff22 100%);
            color: #1bff6a;
            border: 1.5px solid #1bff6a;
        }
        .nyf-section-popup-close {
            position: absolute;
            top: 10px;
            right: 18px;
            background: none;
            border: none;
            color: #1bff6a;
            font-size: 2em;
            cursor: pointer;
            z-index: 2;
        }
        @media (max-width:500px) {
            .nyf-section-popup { width: 98vw; max-width: 98vw; padding: 0.7em 0.1em 0.7em 0.1em; }
            .nyf-section-mobile-btn { font-size: 1em; padding: 0.4em 0.7em; }
        }
        /* Nascondi la scritta Nyfurion Community solo su mobile */
        @media (max-width:700px) {
            .nyf-header span {
                display: none !important;
            }
            /* Nascondi la barra categorie mobile sotto il pulsante */
            #nyf-categories-mobile {
                display: none !important;
            }
        }
    </style>
</head>

<script>
window.initWalletAccess({
    onConnect: function(address, signature) {
        let el = document.getElementById('nyf-wallet-below-chat');
        if (el) el.textContent = 'Wallet: ' + address;
        window.nyfWallet = address;
    },
    buttonId: 'connect-wallet-btn'

<script>
// --- Utility ---
function abbreviateAddress(addr) {
    if (!addr) return '';
    if (addr.length > 20 && addr.startsWith('0x'))
        return addr.slice(0, 6) + "..." + addr.slice(-4);
    return addr;
}
function getQueryParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name);
}

// --- Login & Profile ---
let wallet = getQueryParam('wallet');
let userData = JSON.parse(localStorage.getItem('nyfurionCommunityUser') || '{}');
let user = wallet && userData[wallet] ? userData[wallet] : null;
const userInfoDiv = document.getElementById('nyf-user-info');
const profileModalRoot = document.getElementById('nyf-profile-modal-root');

async function ensureWallet() {
    if (!wallet) {
        if (!(window.ethereum && window.ethereum.isMetaMask)) {
            userInfoDiv.innerHTML = `<span style="color:#ff7c7c;">Connect MetaMask to access</span>`;
            return false;
        }
        let accounts;
        try {
            accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        } catch {
            userInfoDiv.innerHTML = `<span style="color:#ff7c7c;">Wallet not connected</span>`;
            return false;
        }
        wallet = accounts[0];
        window.location.search = "?wallet=" + encodeURIComponent(wallet);
        return false;
    }
    return true;
}

function showProfileModal() {
    // Does nothing, registration disabled
}

// --- setupUser modified to not require registration ---
async function setupUser() {
    if (!await ensureWallet()) return false;
    userData = JSON.parse(localStorage.getItem('nyfurionCommunityUser') || '{}');
    user = userData[wallet];
    // If no profile, show only abbreviated wallet without popup
    if (!user) {
        userInfoDiv.innerHTML = `<span style="color:#ff7c7c;">Profile not registered. Read only.</span><span style="font-size:0.93em;color:#232a3a;background:#bafff7;border-radius:7px;padding:0.15em 0.7em;margin-left:0.5em;">${abbreviateAddress(wallet)}</span>`;
        return true;
    }
    userInfoDiv.innerHTML = `<img class="nyf-avatar" src="${user.avatar}" alt="Avatar"><span>${user.name}</span><span style="font-size:0.93em;color:#232a3a;background:#bafff7;border-radius:7px;padding:0.15em 0.7em;margin-left:0.5em;">${abbreviateAddress(wallet)}</span>`;
    return true;
}

// --- Sections ---
const sectionList = document.getElementById('nyf-section-list');
let currentSection = localStorage.getItem('nyfurionCommunitySection') || 'generale';
sectionList.querySelectorAll('.nyf-section-btn').forEach(btn => {
    btn.onclick = function() {
        sectionList.querySelectorAll('.nyf-section-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentSection = this.getAttribute('data-section');
        localStorage.setItem('nyfurionCommunitySection', currentSection);
        renderChat();
    };
});
sectionList.querySelector(`.nyf-section-btn[data-section="${currentSection}"]`)?.classList.add('active');

// --- Chat Storage ---
function getChat() {
    try { return JSON.parse(localStorage.getItem('nyfurionCommunityChat') || '{}'); } catch { return {}; }
}
function setChat(obj) {
    localStorage.setItem('nyfurionCommunityChat', JSON.stringify(obj));
}

// --- Chat Rendering ---
// --- Chat Rendering stile WhatsApp ---
function renderChat() {
    const box = document.getElementById('nyf-chatbox');
    const chatForm = document.getElementById('nyf-form');
    if (chatForm) chatForm.style.display = 'flex';

    // Wallet sopra la chat, più compatto su mobile
    let walletDiv = document.getElementById('nyf-wallet-visible');
    if (!walletDiv) {
        walletDiv = document.createElement('div');
        walletDiv.id = 'nyf-wallet-visible';
        walletDiv.style.cssText = 'margin:0.2em 0 0.2em 0;padding:0.18em 0.5em;background:rgba(27,255,106,0.08);color:#1bff6a;font-family:monospace;font-size:0.93em;border-radius:7px;display:flex;align-items:center;gap:0.3em;word-break:break-all;max-width:98vw;';
        box.parentNode.insertBefore(walletDiv, box);
    }
    walletDiv.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;"><rect x="3" y="7" width="18" height="10" rx="3" stroke="#1bff6a" stroke-width="2" fill="none"/><rect x="7" y="3" width="10" height="4" rx="2" stroke="#1bff6a" stroke-width="2" fill="none"/></svg> <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80vw;display:inline-block;">${wallet || ''}</span>`;

    const allChats = getChat();
    const arr = allChats[currentSection] || [];
    box.innerHTML = arr.length === 0
        ? "<div style='color:#aaa;text-align:center;margin-top:0.7em;font-size:0.95em;'>Nessun messaggio in questa sezione.</div>"
        : arr.map((msg, idx) => {
            const isMe = msg.wallet === wallet;
            let safeText = (msg.text || '').replace(/</g,"&lt;").replace(/>/g,"&gt;");
            let attachmentsHtml = '';
            if (msg.attachments && Array.isArray(msg.attachments) && msg.attachments.length) {
                attachmentsHtml = `<div class="attachments" style="margin-top:0.09em;">${msg.attachments.map(a =>
                    a && a.type && a.type.startsWith('image/') ? `<img src="${a.data}" alt="img" style="max-width:44vw;max-height:44vw;border-radius:5px;margin-right:0.13em;margin-bottom:0.07em;border:1px solid #232a3a;">`
                    : (a && a.data && a.name ? `<a href="${a.data}" target="_blank" style="color:#00eaff;text-decoration:underline;font-size:0.93em;">${a.name}</a>` : '')
                ).join('')}</div>`;
            }
            return `
            <div class="nyf-message${isMe ? ' me' : ''}" data-idx="${idx}" style="
                display:flex;
                align-items:flex-end;
                gap:0.2em;
                justify-content:${isMe ? 'flex-end' : 'flex-start'};
                margin-bottom:0.18em;
                width:100%;
            ">
                ${!isMe ? `<img class="nyf-avatar" src="${(userData[msg.wallet] && userData[msg.wallet].avatar) || ''}" alt="Avatar" style="flex-shrink:0;width:22px;height:22px;">` : ''}
                <div class="nyf-message-content" style="
                    background:${isMe ? 'linear-gradient(90deg,#1bff6a33 0%,#00eaff33 100%)' : 'rgba(35,42,58,0.93)'};
                    border-radius:8px;
                    padding:0.18em 0.5em;
                    max-width:80vw;
                    min-width:0;
                    box-shadow:0 0 2px #00eaff11;
                    border:1px solid #1bff6a22;
                    ${isMe ? 'align-items:flex-end;text-align:right;' : ''}
                    margin-bottom:0.05em;
                    font-size:0.99em;
                    word-break:break-word;
                ">
                    <span class="meta" style="display:flex;align-items:center;gap:0.18em;${isMe ? 'justify-content:flex-end;' : ''};font-size:0.93em;">
                        ${(userData[msg.wallet] && userData[msg.wallet].name) || abbreviateAddress(msg.wallet)}
                        <span class="date" style="font-size:0.89em;">${msg.date || ''}</span>
                    </span>
                    <div class="text" data-msg-text style="margin-top:0.04em;font-size:1em;">
                        ${safeText}
                    </div>
                    ${attachmentsHtml}
                    ${isMe ? `
                        <div class="nyf-msg-actions" style="display:flex;gap:0.2em;margin-top:0.07em;justify-content:flex-end;">
                            <button class="nyf-btn-edit" style="background:none;border:none;color:#1bff6a;font-size:1em;cursor:pointer;padding:0;" title="Modifica" aria-label="Modifica">&#9998;</button>
                            <button class="nyf-btn-delete" style="background:none;border:none;color:#ff7c7c;font-size:1em;cursor:pointer;padding:0;" title="Elimina" aria-label="Elimina">&#128465;</button>
                        </div>
                    ` : ''}
                </div>
                ${isMe ? `<img class="nyf-avatar" src="${(userData[msg.wallet] && userData[msg.wallet].avatar) || ''}" alt="Avatar" style="flex-shrink:0;width:22px;height:22px;">` : ''}
            </div>
            `;
        }).join('');
    box.scrollTop = box.scrollHeight;

    // Gestione modifica/cancella
    box.querySelectorAll('.nyf-btn-edit').forEach(btn => {
        btn.onclick = function(e) {
            e.preventDefault();
            const msgDiv = btn.closest('.nyf-message');
            const idx = +msgDiv.getAttribute('data-idx');
            const textDiv = msgDiv.querySelector('[data-msg-text]');
            const oldText = (getChat()[currentSection] || [])[idx]?.text || '';
            textDiv.innerHTML = `<input type="text" value="${oldText.replace(/"/g,'&quot;')}" style="width:90%;font-size:1em;padding:0.2em;border-radius:6px;border:1px solid #1bff6a;background:#232a3a;color:#fff;"> <button class="nyf-btn-save" style="background:#1bff6a;color:#181a22;border:none;border-radius:6px;padding:0.2em 0.7em;font-weight:bold;cursor:pointer;">Salva</button> <button class="nyf-btn-cancel" style="background:#232a3a;color:#fff;border:none;border-radius:6px;padding:0.2em 0.7em;cursor:pointer;">Annulla</button>`;
            const input = textDiv.querySelector('input');
            input.focus();
            textDiv.querySelector('.nyf-btn-save').onclick = function() {
                const newText = input.value.trim();
                if (!newText) return;
                let allChats = getChat();
                allChats[currentSection][idx].text = newText;
                setChat(allChats);
                renderChat();
            };
            textDiv.querySelector('.nyf-btn-cancel').onclick = function() {
                renderChat();
            };
            input.onkeydown = function(ev) {
                if (ev.key === "Enter") textDiv.querySelector('.nyf-btn-save').click();
                if (ev.key === "Escape") textDiv.querySelector('.nyf-btn-cancel').click();
            };
        };
    });
    box.querySelectorAll('.nyf-btn-delete').forEach(btn => {
        btn.onclick = function(e) {
            e.preventDefault();
            const msgDiv = btn.closest('.nyf-message');
            const idx = +msgDiv.getAttribute('data-idx');
            if (confirm("Vuoi eliminare questo messaggio?")) {
                let allChats = getChat();
                allChats[currentSection].splice(idx, 1);
                setChat(allChats);
                renderChat();
            }
        };
    });
}

// --- Chat Form ---
// Sblocca sempre il form per l'invio dei messaggi
const chatForm = document.getElementById('nyf-form');
const msgInput = document.getElementById('nyf-message');
const fileInput = document.getElementById('nyf-file');
if (chatForm) chatForm.style.display = 'flex';

// Abilita sempre il pulsante Send
const sendBtn = chatForm.querySelector('button[type="submit"]');
if (sendBtn) sendBtn.disabled = false;

// --- ANTEPRIMA IMMAGINI PRIMA DELL'INVIO ---
let previewDiv = null;
fileInput.onchange = function() {
    // Rimuovi eventuale anteprima precedente
    if (previewDiv) {
        previewDiv.remove();
        previewDiv = null;
    }
    if (!fileInput.files || !fileInput.files.length) return;
    previewDiv = document.createElement('div');
    previewDiv.id = "nyf-file-preview";
    previewDiv.style.cssText = "display:flex;flex-wrap:wrap;gap:0.4em;margin:0.4em 0 0.2em 0;align-items:center;";
    for (let i = 0; i < fileInput.files.length; i++) {
        const file = fileInput.files[i];
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = document.createElement('img');
                img.src = ev.target.result;
                img.style.cssText = "max-width:60px;max-height:60px;border-radius:6px;border:1px solid #1bff6a22;";
                previewDiv.appendChild(img);
            };
            reader.readAsDataURL(file);
        } else {
            // Mostra solo il nome per file non immagine
            const span = document.createElement('span');
            span.textContent = file.name;
            span.style.cssText = "color:#bafff7;font-size:0.93em;background:#232a3a;padding:0.2em 0.5em;border-radius:5px;";
            previewDiv.appendChild(span);
        }
    }
    // Inserisci la preview subito sotto la barra messaggi
    const formWrap = document.querySelector('.nyf-form-wrap');
    if (formWrap) formWrap.parentNode.insertBefore(previewDiv, formWrap.nextSibling);
};

// Invio messaggi
chatForm.onsubmit = function(e) {
    e.preventDefault();
    let text = msgInput.value.trim();
    // Permetti invio se c'è testo o file
    if (!text && (!fileInput.files || fileInput.files.length === 0)) return;
    let allChats = getChat();
    if (!allChats[currentSection]) allChats[currentSection] = [];
    let attachments = [];
    if (fileInput.files && fileInput.files.length) {
        let filesDone = 0;
        for (let i = 0; i < fileInput.files.length; i++) {
            const file = fileInput.files[i];
            if (file.size > 2*1024*1024) { alert("File troppo grande (max 2MB)."); filesDone++; continue; }
            const reader = new FileReader();
            reader.onload = function(ev) {
                attachments.push({ name: file.name, type: file.type, data: ev.target.result });
                filesDone++;
                if (filesDone === fileInput.files.length) {
                    allChats[currentSection].push({
                        wallet,
                        text,
                        date: new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}),
                        attachments
                    });
                    setChat(allChats);
                    msgInput.value = '';
                    fileInput.value = '';
                    if (previewDiv) { previewDiv.remove(); previewDiv = null; }
                    renderChat();
                }
            };
            reader.readAsDataURL(file);
        }
        return;
    }
    allChats[currentSection].push({
        wallet,
        text,
        date: new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}),
        attachments:[]
    });
    setChat(allChats);
    msgInput.value = '';
    fileInput.value = '';
    if (previewDiv) { previewDiv.remove(); previewDiv = null; }
    renderChat();
};

fileInput.onchange = function() {
    // Show file preview if needed
};

(async function init() {
    if (!await setupUser()) {
        document.getElementById('nyf-form').style.display = 'none';
        return;
    }
    document.getElementById('nyf-form').style.display = 'flex';
    renderChat();
})();

// --- MOBILE SECTION POPUP LOGIC ---
const mobileBtn = document.getElementById('nyf-section-mobile-btn');
const mobileLabel = document.getElementById('nyf-section-mobile-label');
const popupBg = document.getElementById('nyf-section-popup-bg');
const popupClose = document.getElementById('nyf-section-popup-close');
const popupBtns = Array.from(document.querySelectorAll('.nyf-section-popup .nyf-section-btn'));

function updateMobileSectionLabel() {
    let label = "# General";
    switch(currentSection) {
        case "guardiani": label = "# Guardians"; break;
        case "ribelli": label = "# Rebels"; break;
        case "predatori": label = "# Predators"; break;
        case "nft": label = "# NFT"; break;
        case "eventi": label = "# Events"; break;
    }
    mobileLabel.textContent = label;
}
updateMobileSectionLabel();

function showSectionPopup() {
    popupBg.style.display = "flex";
    showWalletAddress();
    // Highlight current
    popupBtns.forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-section') === currentSection);
    });
}
function hideSectionPopup() {
    popupBg.style.display = "none";
}

mobileBtn.onclick = showSectionPopup;
popupClose.onclick = hideSectionPopup;
popupBg.onclick = function(e) {
    if (e.target === popupBg) hideSectionPopup();
};
popupBtns.forEach(btn => {
    btn.onclick = function() {
        currentSection = this.getAttribute('data-section');
        localStorage.setItem('nyfurionCommunitySection', currentSection);
        sectionList.querySelectorAll('.nyf-section-btn').forEach(b => b.classList.remove('active'));
        // Aggiorna anche la sidebar desktop se visibile
        let desktopBtn = sectionList.querySelector(`.nyf-section-btn[data-section="${currentSection}"]`);
        if (desktopBtn) desktopBtn.classList.add('active');
        updateMobileSectionLabel();
        hideSectionPopup();
        renderChat();
    };
});

// Mostra l'indirizzo del wallet collegato nel popup mobile, header e sotto il pulsante mobile
function showWalletAddress() {
    const elPopup = document.getElementById('nyf-wallet-address-text');
    const elHeader = document.getElementById('nyf-header-wallet-text');
    const elMobile = document.getElementById('nyf-wallet-mobile');
    const elMobileText = document.getElementById('nyf-wallet-mobile-text');
    const elMobileVisible = document.getElementById('nyf-wallet-mobile-visible-text');
    if (wallet) {
        elPopup.textContent = wallet;
        elHeader.textContent = wallet;
        elMobileText.textContent = wallet;
        elMobileVisible.textContent = wallet;
        // Mostra solo su mobile
        if (window.innerWidth <= 700) {
            elMobile.style.display = "flex";
            elMobileVisible.style.display = "flex";
        } else {
            elMobile.style.display = "none";
            elMobileVisible.style.display = "none";
        }
    } else {
        elPopup.textContent = '';
        elHeader.textContent = '';
        elMobileText.textContent = '';
        elMobileVisible.textContent = '';
        elMobile.style.display = "none";
        elMobileVisible.style.display = "none";
    }
}
window.addEventListener('resize', showWalletAddress);

// Aggiorna l'indirizzo wallet all'avvio
showWalletAddress();

(function() {
    function renderCategoriesMobile() {
        const container = document.getElementById('nyf-categories-mobile');
        if (!container) return;
        if (window.innerWidth > 700) {
            container.style.display = 'none';
            container.innerHTML = '';
            return;
        }
        container.style.display = 'block';
        container.innerHTML = `
            <div class="nyf-sidebar-title">Categorie</div>
            <ul class="nyf-section-list">
                <li><button class="nyf-section-btn" data-section="generale"># General</button></li>
                <li><button class="nyf-section-btn" data-section="guardiani"># Guardians</button></li>
                <li><button class="nyf-section-btn" data-section="ribelli"># Rebels</button></li>
                <li><button class="nyf-section-btn" data-section="predatori"># Predators</button></li>
                <li><button class="nyf-section-btn" data-section="nft"># NFT</button></li>
                <li><button class="nyf-section-btn" data-section="eventi"># Events</button></li>
            </ul>
        `;
        // Attiva la categoria corrente
        const btns = container.querySelectorAll('.nyf-section-btn');
        btns.forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-section') === (localStorage.getItem('nyfurionCommunitySection') || 'generale'));
            btn.onclick = function() {
                const section = this.getAttribute('data-section');
                localStorage.setItem('nyfurionCommunitySection', section);
                document.querySelectorAll('.nyf-section-btn').forEach(bb => bb.classList.remove('active'));
                this.classList.add('active');
                window.currentSection = section;
                if (typeof renderChat === 'function') renderChat();
            };
        });
    }
    window.addEventListener('resize', renderCategoriesMobile);
    window.addEventListener('DOMContentLoaded', renderCategoriesMobile);
})();
</script>
