<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Nyfurion Community</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #181a1b; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; }
        .container { display: flex; flex-direction: column; min-height: 100vh; }
        .sidebar { background: #23272b; padding: 0.05em 0.2em 0.05em 0.2em; }
        .sidebar h2 { color: #1bff6a; font-size: 0.95em; margin-bottom: 0.1em; text-align: left; }
        .categories { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: row; gap: 0.3em; justify-content: center; align-items: center; min-height: 28px; }
        .category { color: #7fffd4; font-size: 0.92em; padding: 0.12em 0.5em; border-radius: 10px 10px 0 0; cursor: pointer; transition: background 0.2s, color 0.2s; background: transparent; font-weight: 600; line-height: 1; }
        .category.selected, .category:hover { background: linear-gradient(90deg, #1bff6a 0%, #00eaff 100%); color: #181a1b; box-shadow: 0 2px 6px #1bff6a22; }
        .chat-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100vw; min-height: 0; }
        .chat-title { font-size: 1em; margin: 0.4em 0 0.2em 0; }
        .chat-card {
            width: 95vw;
            max-width: 900px;
            background: #202225;
            border-radius: 18px;
            box-shadow: 0 8px 32px #000a, 0 1.5px 0 #1bff6a44 inset;
            padding: 0.5em 0.1em 0.5em 0.1em;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin: 0 auto;
            position: relative;
        }
        .messages {
            width: 100%;
            min-height: 320px;
            max-height: 400px;
            overflow-y: auto;
            background: #181a1b;
            border-radius: 18px;
            padding: 1.2em;
            margin-bottom: 0.5em;
            box-shadow: 0 2px 16px #00eaff22 inset, 0 0 0 2px #1bff6a;
            font-size: 1.1em;
            display: flex;
            flex-direction: column;
            gap: 0.5em;
        }
        .messages::-webkit-scrollbar { width: 10px; background: #23272b; border-radius: 8px; }
        .messages::-webkit-scrollbar-thumb { background: #1bff6a; border-radius: 8px; }
        .msg { margin-bottom: 0.7em; display: flex; align-items: flex-end; }
        .msg .avatar { width: 38px; height: 38px; border-radius: 50%; background: #333 url('https://i.imgur.com/0y0y0y0.png') center/cover no-repeat; margin-right: 0.7em; flex-shrink: 0; border: 2px solid #23272b; box-shadow: 0 1px 4px #0006; display: none; }
        .msg.me { flex-direction: row-reverse; }
        .msg.me .avatar { margin-left: 0.7em; margin-right: 0; }
        .msg .bubble { background: #fff; color: #181a1b; border-radius: 18px 18px 4px 18px; padding: 0.6em 1.1em; max-width: 70vw; display: inline-block; box-shadow: 0 2px 8px #0002; font-size: 1.08em; word-break: break-word; }
        .msg.me .bubble { background: #dcf8c6; color: #181a1b; border-radius: 18px 18px 18px 4px; }
        .msg .msg-file { margin-top: 0.2em; }
        .msg .msg-file img { max-width: 180px; max-height: 120px; border-radius: 10px; box-shadow: 0 1px 6px #0003; display: block; }
        .msg .meta { font-size: 0.82em; color: #bafff7; margin-top: 0.18em; text-align: right; }
        .msg.me .meta { color: #7fffd4; }
        .msg .bubble:has(img) { padding: 0.2em; background: none; box-shadow: none; }
        .msg .bubble.emoji-only { font-size: 2.2em; background: none; box-shadow: none; padding: 0.2em 0.5em; }
        .chat-form {
            display: flex;
            gap: 0.2em;
            width: 98%;
            align-items: center;
            background: #181a1b;
            border-radius: 10px;
            box-shadow: 0 2px 8px #1bff6a33;
            margin: 0 auto;
            position: absolute;
            left: 1%;
            right: 1%;
            bottom: 1.2em;
            z-index: 2;
            box-sizing: border-box;
            max-width: 880px;
            padding: 0.15em 0.2em;
            height: 38px;
        }
        .chat-form label[for="file-input"] {
            min-width: 28px;
            min-height: 28px;
            max-width: 28px;
            max-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            background: #23272b;
            border-radius: 7px;
            cursor: pointer;
            transition: background 0.2s;
            margin-right: 0.1em;
        }
        .chat-form label[for="file-input"]:hover {
            background: #1bff6a33;
        }
        .chat-form input[type="file"] {
            display: none;
        }
        .chat-form input[type="text"] {
            font-size: 0.95em;
            padding: 0.25em 0.7em;
            border-radius: 8px;
            min-height: 28px;
            border: none;
            background: #23272b;
            color: #fff;
            flex: 1;
            margin-right: 0.1em;
        }
        .chat-form button {
            font-size: 0.95em;
            padding: 0.25em 0.9em;
            border-radius: 8px;
            min-width: 48px;
            min-height: 28px;
            background: linear-gradient(90deg, #1bff6a 0%, #00eaff 100%);
            color: #181a1b;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .chat-form button:hover {
            background: #1bff6a;
            color: #23272b;
        }
        #register-popup {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(24,26,27,0.98);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #register-popup .popup-content {
            background: #23272b;
            border-radius: 18px;
            box-shadow: 0 8px 32px #000a, 0 1.5px 0 #1bff6a44 inset;
            padding: 2.2em 2em 2em 2em;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 320px;
            max-width: 90vw;
        }
        #register-popup h2 {
            color: #1bff6a;
            margin-bottom: 1em;
        }
        #register-popup input[type="text"] {
            padding: 0.5em 1em;
            border-radius: 8px;
            border: none;
            background: #181a1b;
            color: #fff;
            font-size: 1.1em;
            margin-bottom: 1em;
            width: 220px;
        }
        #register-popup input[type="file"] {
            margin-bottom: 1em;
            color: #7fffd4;
        }
        #register-popup .avatar-preview {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: #333;
            margin-bottom: 1em;
            object-fit: cover;
            border: 2px solid #1bff6a;
        }
        #register-popup button {
            background: linear-gradient(90deg, #1bff6a 0%, #00eaff 100%);
            color: #181a1b;
            border: none;
            border-radius: 8px;
            padding: 0.5em 1.5em;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5em;
        }
        @media (max-width: 900px) {
            .chat-card { width: 99vw; padding: 1.2em 0.5em 1em 0.5em; }
        }
        @media (max-width: 600px) {
            .chat-title { font-size: 1.3em; margin: 0.7em 0 0.5em 0; }
            .chat-card { padding: 0.7em 0.1em 0.7em 0.1em; }
            .messages { min-height: 180px; max-height: 250px; font-size: 1em; overflow-y: visible; }
            .sidebar { padding: 0.7em 0.2em 0.2em 0.2em; }
            .category { font-size: 0.95em; padding: 0.5em 0.7em; }
        }
        @media (max-width: 480px) {
            body { background: #181a1b; margin: 0; }
            .container { padding: 0 !important; }
            .sidebar { padding: 0.5em 0.2em 0.2em 0.2em; margin-bottom: 0.2em; }
            .categories {
                gap: 0.1em;
                min-height: 28px;
                overflow-x: auto;
                flex-wrap: nowrap;
                justify-content: flex-start;
                scrollbar-width: none;
                margin-bottom: 0.2em;
            }
            .categories::-webkit-scrollbar { display: none; }
            .category {
                font-size: 1em;
                padding: 0.4em 0.7em;
                border-radius: 16px 16px 0 0;
                min-width: 80px;
                text-align: center;
            }
            .chat-title {
                font-size: 1.1em;
                margin: 0.7em 0 0.5em 0;
                text-align: center;
            }
            .chat-section {
                padding: 0;
                margin: 0;
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
            }
            .chat-card {
                width: 96vw;
                min-width: 0;
                max-width: 96vw;
                padding: 0.2em 0.01em 0.2em 0.01em;
                border-radius: 12px;
                box-shadow: 0 2px 16px #00eaff22 inset, 0 0 0 2px #1bff6a;
                margin: 0 auto 0.5em auto;
                background: #202225;
                display: flex;
                flex-direction: column;
                min-height: 50vh;
                max-height: 60vh;
                justify-content: flex-start;
            }
            .messages {
                min-height: 30vh;
                max-height: 40vh;
                font-size: 1.08em;
                padding: 1em 0.5em 1em 0.5em;
                border-radius: 10px;
                background: #191b1c;
                margin-bottom: 0.5em;
                flex: 1;
                overflow-y: visible;
            }
            .msg { margin-bottom: 0.7em; }
            .msg .avatar {
                width: 32px;
                height: 32px;
                display: block !important;
                margin-right: 0.5em;
            }
            .msg .bubble {
                font-size: 1.08em;
                max-width: 80vw;
                padding: 0.7em 1.1em;
                border-radius: 18px 18px 8px 18px;
                margin: 0;
            }
            .msg.me .bubble {
                border-radius: 18px 18px 18px 8px;
            }
            .chat-form {
                position: relative;
                width: 96vw;
                max-width: 96vw;
                height: 48px;
                background: #23272b;
                border-radius: 10px;
                box-shadow: 0 -2px 8px #1bff6a33;
                padding: 0.2em 0.5em;
                z-index: 100;
                display: flex;
                align-items: center;
                gap: 0.3em;
                margin: 0 auto 0.5em auto;
                top: 0;
            }
            #register-popup .popup-content {
                min-width: 180px;
                padding: 1.2em 0.5em 1em 0.5em;
            }
            #register-popup input[type="text"] {
                font-size: 1em;
                width: 120px;
            }
            #register-popup .avatar-preview {
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <h2>Categories</h2>
            <ul class="categories" id="categories">
                <li class="category selected" data-cat="General">General</li>
                <li class="category" data-cat="Guardians">Guardians</li>
                <li class="category" data-cat="Rebels">Rebels</li>
                <li class="category" data-cat="Predators">Predators</li>
                <li class="category" data-cat="NFT">NFT</li>
                <li class="category" data-cat="Events">Events</li>
            </ul>
        </nav>
        <section class="chat-section">
            <div class="chat-title" id="chat-title">General</div>
            <div class="chat-card">
                <!-- Un contenitore messaggi per ogni categoria -->
                <div class="messages" id="messages-General"></div>
                <div class="messages" id="messages-Guardians" style="display:none"></div>
                <div class="messages" id="messages-Rebels" style="display:none"></div>
                <div class="messages" id="messages-Predators" style="display:none"></div>
                <div class="messages" id="messages-NFT" style="display:none"></div>
                <div class="messages" id="messages-Events" style="display:none"></div>
                <!-- WhatsApp style: avatar, bubble, emoji, file/image preview -->
                <template id="msg-template">
                    <div class="msg">
                        <div class="avatar"></div>
                        <div class="bubble"></div>
                        <div class="msg-file"></div>
                        <div class="meta"></div>
                        <div class="msg-actions" style="display:none; gap:0.3em; margin-left:0.5em;">
                            <button class="edit-btn" style="font-size:0.8em;">✏️</button>
                            <button class="delete-btn" style="font-size:0.8em;">🗑️</button>
                        </div>
                    </div>
                </template>
                <form class="chat-form" id="chat-form" autocomplete="off" enctype="multipart/form-data">
                    <label for="file-input">📎</label>
                    <input type="file" id="file-input" />
                    <input type="text" id="msg-input" placeholder="Scrivi un messaggio..." required />
                    <button type="submit">Invia</button>
                </form>
            </div>
        </section>
        <div id="register-popup">
          <form class="popup-content" id="register-form" autocomplete="off">
            <h2>Registrazione Community</h2>
            <img src="https://i.imgur.com/0y0y0y0.png" class="avatar-preview" id="avatar-preview" alt="Avatar Preview">
            <input type="file" id="avatar-input" accept="image/*">
            <input type="text" id="username-input" placeholder="Inserisci il tuo nome" maxlength="20" required>
            <button type="submit">Entra</button>
          </form>
        </div>
    </div>
    <script>
    // Gestione categorie e messaggi separati
    const categories = ['General', 'Guardians', 'Rebels', 'Predators', 'NFT', 'Events'];
    let currentCategory = 'General';
    let messages = {};
    categories.forEach(cat => {
        messages[cat] = JSON.parse(localStorage.getItem('messages-' + cat) || '[]');
    });

    function switchCategory(cat) {
        currentCategory = cat;
        document.getElementById('chat-title').textContent = cat;
        categories.forEach(c => {
            document.getElementById('messages-' + c).style.display = (c === cat) ? '' : 'none';
            const tab = document.querySelector('.category[data-cat="' + c + '"]');
            if (tab) tab.classList.toggle('selected', c === cat);
        });
        renderMessages(cat);
    }

    function renderMessages(cat) {
        const container = document.getElementById('messages-' + cat);
        if (container) {
            container.innerHTML = '';
            messages[cat].forEach((msg, idx) => {
                let text, avatar;
                if (typeof msg === 'string') {
                    text = msg;
                    const user = getUser();
                    avatar = user && user.avatar ? user.avatar : 'https://i.imgur.com/0y0y0y0.png';
                } else {
                    text = msg.text;
                    avatar = msg.avatar && msg.avatar !== '' ? msg.avatar : 'https://i.imgur.com/0y0y0y0.png';
                }
                const div = document.createElement('div');
                div.className = 'msg';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.marginBottom = '0.18em';
                div.innerHTML = `
                    <div style=\"display:flex;align-items:center;\">
                      <img src=\"${avatar}\" class=\"avatar\" style=\"width:22px;height:22px;border-radius:50%;border:1px solid #1bff6a;margin-right:7px;object-fit:cover;display:block;\" alt=\"avatar\" />
                    </div>
                    <div style=\"background:#23272b; border-radius:9px; padding:0.32em 0.7em; min-width:28px; max-width:60vw; color:#fff; font-size:0.98em; display:flex; align-items:center; position:relative; box-shadow:0 1px 4px #0002; gap:0.5em;\">
                      <span class='msg-text' style=\"word-break:break-word;\">${text}</span>
                      <div class=\"msg-menu-wrap\" style=\"position:relative; margin-left:4px;\">
                        <button class=\"msg-menu-btn\" style=\"background:transparent; border:none; cursor:pointer; padding:0 1.5px; display:flex; flex-direction:column; align-items:center; gap:1.5px; height:18px; justify-content:center;\">
                          <span style=\"display:inline-block; width:3px; height:3px; background:#bafff7; border-radius:50%; margin:0;\"></span>
                          <span style=\"display:inline-block; width:3px; height:3px; background:#bafff7; border-radius:50%; margin:0;\"></span>
                          <span style=\"display:inline-block; width:3px; height:3px; background:#bafff7; border-radius:50%; margin:0;\"></span>
                        </button>
                        <div class=\"msg-menu-popup\" style=\"display:none; position:absolute; right:0; top:16px; background:#23272b; border-radius:7px; box-shadow:0 2px 8px #0006; min-width:90px; z-index:10;\">
                          <button class=\"delete-btn\" style=\"width:100%; background:transparent; border:none; color:#ff4d4d; padding:6px 0; font-size:0.93em; border-radius:7px; cursor:pointer;\">Elimina</button>
                        </div>
                      </div>
                    </div>
                `;
                // Gestione menu puntini
                const menuBtn = div.querySelector('.msg-menu-btn');
                const menuPopup = div.querySelector('.msg-menu-popup');
                menuBtn.onclick = function(e) {
                    e.stopPropagation();
                    document.querySelectorAll('.msg-menu-popup').forEach(p => { if(p!==menuPopup) p.style.display='none'; });
                    menuPopup.style.display = menuPopup.style.display === 'block' ? 'none' : 'block';
                };
                document.addEventListener('click', function hideMenu(ev) {
                    if (!div.contains(ev.target)) menuPopup.style.display = 'none';
                }, { once: true });
                // Elimina
                div.querySelector('.delete-btn').onclick = function() {
                    messages[cat].splice(idx, 1);
                    localStorage.setItem('messages-' + cat, JSON.stringify(messages[cat]));
                    renderMessages(cat);
                };
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }
    }

    // Registrazione utente
    const registerPopup = document.getElementById('register-popup');
    const registerForm = document.getElementById('register-form');
    const avatarInput = document.getElementById('avatar-input');
    const avatarPreview = document.getElementById('avatar-preview');
    const usernameInput = document.getElementById('username-input');

    function getUser() {
        return JSON.parse(localStorage.getItem('community-user') || 'null');
    }
    function setUser(user) {
        localStorage.setItem('community-user', JSON.stringify(user));
    }
    // Mostra popup se non registrato
    window.addEventListener('DOMContentLoaded', () => {
        const user = getUser();
        if (!user) {
            registerPopup.style.display = 'flex';
        } else {
            registerPopup.style.display = 'none';
        }
    });
    // Preview avatar
    avatarInput.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                avatarPreview.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }
    };
    // Salva utente
    registerForm.onsubmit = function(e) {
        e.preventDefault();
        const name = usernameInput.value.trim();
        let avatar = avatarPreview.src;
        if (!name) return;
        setUser({ name, avatar });
        registerPopup.style.display = 'none';
    };

    document.querySelectorAll('.category').forEach(btn => {
        btn.onclick = () => switchCategory(btn.dataset.cat);
    });

    // Preview immagine e invio foto direttamente nella barra input
    let imagePreviewData = null;
    const fileInput = document.getElementById('file-input');
    const chatForm = document.getElementById('chat-form');
    const msgInput = document.getElementById('msg-input');

    // Crea container per la preview dentro la chat-form
    let inlinePreview = document.createElement('div');
    inlinePreview.id = 'inline-image-preview';
    inlinePreview.style.display = 'none';
    inlinePreview.style.flex = '1';
    inlinePreview.style.alignItems = 'center';
    inlinePreview.style.gap = '0.7em';
    inlinePreview.style.background = '#23272b';
    inlinePreview.style.borderRadius = '8px';
    inlinePreview.style.padding = '0.1em 0.5em';
    inlinePreview.style.marginRight = '0.1em';
    inlinePreview.innerHTML = `
      <img id="image-preview-inline" src="" style="max-width:38px; max-height:38px; border-radius:7px; box-shadow:0 1px 6px #00eaff55; border:2px solid #1bff6a; margin-right:0.5em;" alt="preview" />
      <button id="send-image-btn-inline" style="background:linear-gradient(90deg,#1bff6a,#00eaff);color:#181a1b;border:none;border-radius:8px;padding:0.2em 0.8em;font-weight:600;cursor:pointer;">Invia foto</button>
      <button id="cancel-image-btn-inline" style="background:#23272b;color:#fff;border:none;border-radius:8px;padding:0.2em 0.8em;font-weight:600;cursor:pointer;">Annulla</button>
    `;
    msgInput.parentNode.insertBefore(inlinePreview, msgInput);

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                imagePreviewData = ev.target.result;
                document.getElementById('image-preview-inline').src = imagePreviewData;
                inlinePreview.style.display = 'flex';
                msgInput.style.display = 'none';
                // Rimuovi eventuali listener precedenti
                const sendBtn = document.getElementById('send-image-btn-inline');
                const cancelBtn = document.getElementById('cancel-image-btn-inline');
                sendBtn.onclick = null;
                cancelBtn.onclick = null;
                // Listener invio foto
                sendBtn.onclick = function(e) {
                    e.preventDefault();
                    if (!imagePreviewData) return;
                    const user = getUser();
                    const msgObj = {
                        text: '',
                        avatar: user && user.avatar ? user.avatar : 'https://i.imgur.com/0y0y0y0.png',
                        image: imagePreviewData
                    };
                    messages[currentCategory].push(msgObj);
                    localStorage.setItem('messages-' + currentCategory, JSON.stringify(messages[currentCategory]));
                    imagePreviewData = null;
                    inlinePreview.style.display = 'none';
                    msgInput.style.display = '';
                    fileInput.value = '';
                    renderMessages(currentCategory);
                };
                // Listener annulla
                cancelBtn.onclick = function(e) {
                    e.preventDefault();
                    imagePreviewData = null;
                    inlinePreview.style.display = 'none';
                    msgInput.style.display = '';
                    fileInput.value = '';
                };
            };
            reader.readAsDataURL(file);
        }
    });

    // Modifica l'invio del form per gestire anche la preview immagine inline
    chatForm.onsubmit = function(e) {
        e.preventDefault();
        if (imagePreviewData) {
            document.getElementById('send-image-btn-inline').click();
            return;
        }
        const text = msgInput.value.trim();
        if (!text) return;
        const user = getUser();
        const msgObj = {
            text,
            avatar: user && user.avatar ? user.avatar : 'https://i.imgur.com/0y0y0y0.png'
        };
        messages[currentCategory].push(msgObj);
        localStorage.setItem('messages-' + currentCategory, JSON.stringify(messages[currentCategory]));
        msgInput.value = '';
        renderMessages(currentCategory);
    };

    // Mostra la categoria di default
    switchCategory('General');
    </script>
    <!-- Carica socket.io-client e collega la chat al backend -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="chat-frontend-socket.js"></script>
</body>
</html>
