<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyfurion — Contatti</title>
  <link rel="icon" type="image/png" href="https://cdn.nyfurion.com/ipfs/bafkreif52w6ucsqdbbwstt22fellwobdnnztceenycprkurkr4bo3q3lcq" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --matte-black: #080809;
      --deep-black: #0D0D0E;
      --accent-red: #E30B17;
      --accent-cyan: #00E5FF;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--matte-black);
      background-image: linear-gradient(rgba(8, 8, 9, 0.85), rgba(8, 8, 9, 0.85)), url('contatti-bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: #F2F2F2;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
    
    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 13, 14, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1.5rem 2rem;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .header-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent-red);
    }
    
    .back-btn {
      padding: 0.75rem 1.5rem;
      background: var(--deep-black);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #F2F2F2;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s;
      border-radius: 2px;
    }
    
    .back-btn:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }
    
    /* Main Content */
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 8rem 2rem 4rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .page-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
      text-align: center;
      background: linear-gradient(to bottom, #ffffff, #a0a0a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .contact-info {
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.9;
      color: #c0c0c0;
      margin-bottom: 3rem;
    }
    
    .contact-email {
      color: var(--accent-cyan);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s;
    }
    
    .contact-email:hover {
      color: var(--accent-red);
    }
    
    .email-button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 1rem 2rem;
      background: var(--deep-black);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 4px;
      color: var(--accent-cyan);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s;
    }
    
    .email-button:hover {
      background: rgba(0, 229, 255, 0.1);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.2);
    }
    
    .contact-socials {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 3rem;
    }
    
    .social-link {
      color: #F2F2F2;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.75rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      transition: all 0.3s;
    }
    
    .social-link:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }
    
    .opensea-link {
      border-color: var(--accent-red);
      background: var(--accent-red);
      color: white;
    }
    
    .opensea-link:hover {
      background: transparent;
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .shop-link {
      border-color: var(--accent-cyan);
      background: var(--accent-cyan);
      color: #0a0a0a;
    }

    .shop-link:hover {
      background: transparent;
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Form */
    .contact-form {
      background: rgba(13, 13, 14, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 2.5rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a0a0a0;
      margin-bottom: 0.5rem;
    }
    
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 1rem;
      background: rgba(8, 8, 9, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: #F2F2F2;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: all 0.3s;
    }
    
    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
    }
    
    .form-textarea {
      resize: vertical;
      min-height: 150px;
    }
    
    .form-submit {
      width: 100%;
      padding: 1rem 2rem;
      background: var(--accent-red);
      border: none;
      border-radius: 4px;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .form-submit:hover {
      background: #c00915;
      transform: translateY(-2px);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .header {
        padding: 1rem;
      }
      
      .container {
        padding: 6rem 1rem 2rem;
      }
      
      .contact-form {
        padding: 1.5rem;
      }
      
      .contact-socials {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
