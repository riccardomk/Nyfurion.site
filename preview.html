<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anteprima Sito</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #0b101a;
        }
        body { font-family: Arial, sans-serif; margin: 2em; color: #eaffd0; }
        #preview-frame { width: 100%; height: 80vh; border: 1px solid #ccc; margin-top: 1em; }
        input[type="text"] { width: 60%; padding: 0.5em; }
        button { padding: 0.5em 1em; }
        #no-site-message { color: #b00; margin-bottom: 1em; }
        #nyfurion-bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .preview-content { position: relative; z-index: 2; }
    </style>
</head>
<body>
    <canvas id="nyfurion-bg-canvas"></canvas>
    <div class="preview-content">
        <h1>Anteprima Sito Web</h1>
        <div id="no-site-message">
            Non hai ancora creato un sito.<br>
            <a href="crea-sito.html">Clicca qui per crearne uno!</a>
        </div>
        <input type="text" id="url-input" placeholder="Inserisci l'URL del sito..." value="crea-sito.html" />
        <button onclick="showPreview()">Mostra Anteprima</button>
        <button onclick="openInEdgeLocalhost()">Apri su Edge (localhost)</button>
        <iframe id="preview-frame" src="crea-sito.html"></iframe>
    </div>
    <script>
    // --- Sfondo animato mistico e avanzato ---
    (function(){
        const canvas = document.getElementById('nyfurion-bg-canvas');
        if (!canvas) return;
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        const ctx = canvas.getContext('2d');
        let t = 0;
        // Più particelle, colori mistici e scie
        const PARTICLES = Array.from({length: 60}, () => ({
            x: Math.random()*canvas.width,
            y: Math.random()*canvas.height,
            r: 1.5 + Math.random()*3.5,
            color1: `hsla(${180+Math.random()*80},100%,70%,0.7)`,
            color2: `hsla(${120+Math.random()*120},100%,60%,0.3)`,
            speed: 0.2 + Math.random()*0.7,
            angle: Math.random()*Math.PI*2,
            spiral: Math.random()>0.5
        }));
        function drawGlow(x, y, r, color) {
            const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0, color);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI*2);
            ctx.fillStyle = grad;
            ctx.globalAlpha = 0.7;
            ctx.fill();
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            // Onde mistiche
            for(let w=0;w<3;w++){
                ctx.save();
                ctx.globalAlpha = 0.10;
                ctx.beginPath();
                for(let x=0;x<canvas.width;x+=4){
                    let y = canvas.height/2 + Math.sin((x/120)+t/60+w)*60 + Math.cos((x/80)-t/80-w)*30;
                    if(x===0) ctx.moveTo(x,y);
                    else ctx.lineTo(x,y);
                }
                ctx.strokeStyle = `hsla(${180+w*40+t*2},100%,60%,1)`;
                ctx.lineWidth = 18-w*5;
                ctx.shadowColor = `hsla(${180+w*40},100%,60%,1)`;
                ctx.shadowBlur = 32-w*8;
                ctx.stroke();
                ctx.restore();
            }
            // Particelle
            PARTICLES.forEach(p=>{
                // Movimento mistico
                if(p.spiral) {
                    p.angle += 0.008 + p.speed*0.01;
                    p.x += Math.cos(p.angle)*p.speed*2;
                    p.y += Math.sin(p.angle)*p.speed*2;
                } else {
                    p.x += Math.sin(t/30+p.y/99)*p.speed;
                    p.y += Math.cos(t/40+p.x/111)*p.speed*0.5;
                }
                if(p.x<0) p.x=canvas.width;
                if(p.x>canvas.width) p.x=0;
                if(p.y<0) p.y=canvas.height;
                if(p.y>canvas.height) p.y=0;
                // Glow centrale
                drawGlow(p.x, p.y, p.r*7, p.color2);
                // Corpo particella
                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle = p.color1;
                ctx.shadowColor = p.color1;
                ctx.shadowBlur = 18;
                ctx.globalAlpha = 0.85;
                ctx.fill();
                ctx.restore();
                // Scia
                ctx.save();
                ctx.globalAlpha = 0.18;
                ctx.beginPath();
                ctx.arc(p.x-p.speed*8, p.y-p.speed*8, p.r*1.7, 0, Math.PI*2);
                ctx.fillStyle = p.color2;
                ctx.fill();
                ctx.restore();
            });
            // Bagliore radiale mistico
            for(let i=0;i<2;i++){
                let r = canvas.width/2.2 - i*60 + Math.sin(t/40+i)*30;
                drawGlow(canvas.width/2, canvas.height/2, r, `hsla(${180+i*60+t*2},100%,60%,0.10)`);
            }
            // Effetto mistico extra: spirale centrale
            ctx.save();
            ctx.globalAlpha = 0.13;
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.rotate(t/120);
            ctx.beginPath();
            for(let a=0;a<Math.PI*2*3;a+=0.07){
                let r = 60 + 38*a;
                let x = Math.cos(a)*r;
                let y = Math.sin(a)*r;
                ctx.lineTo(x,y);
            }
            ctx.strokeStyle = `hsla(${220+t*2},100%,70%,1)`;
            ctx.lineWidth = 7;
            ctx.shadowColor = `#00eaff`;
            ctx.shadowBlur = 32;
            ctx.stroke();
            ctx.restore();
        }
        function animate() {
            t += 1;
            draw();
            requestAnimationFrame(animate);
        }
        animate();
    })();
        function showPreview() {
            const url = document.getElementById('url-input').value;
            if (url) {
                document.getElementById('preview-frame').src = url;
            }
        }
        function openInEdgeLocalhost() {
            // Apre la preview su Edge usando localhost:3000/preview
            const edgeUrl = "microsoft-edge:http://localhost:3000/preview";
            window.open(edgeUrl, "_blank");
        }
    </script>
</body>
</html>
