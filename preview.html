<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anteprima Sito</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        #preview-frame { width: 100%; height: 80vh; border: 1px solid #ccc; margin-top: 1em; }
        input[type="text"] { width: 60%; padding: 0.5em; }
        button { padding: 0.5em 1em; }
        #no-site-message { color: #b00; margin-bottom: 1em; }
    </style>
</head>
<body>
    <h1>Anteprima Sito Web</h1>
    <div id="no-site-message">
        Non hai ancora creato un sito.<br>
        <a href="crea-sito.html">Clicca qui per crearne uno!</a>
    </div>
    <input type="text" id="url-input" placeholder="Inserisci l'URL del sito..." value="crea-sito.html" />
    <button onclick="showPreview()">Mostra Anteprima</button>
    <button onclick="openInEdgeLocalhost()">Apri su Edge (localhost)</button>
    <iframe id="preview-frame" src="crea-sito.html"></iframe>
    <script>
        function showPreview() {
            const url = document.getElementById('url-input').value;
            if (url) {
                document.getElementById('preview-frame').src = url;
            }
        }
        function openInEdgeLocalhost() {
            // Apre la preview su Edge usando localhost:3000/preview
            const edgeUrl = "microsoft-edge:http://localhost:3000/preview";
            window.open(edgeUrl, "_blank");
        }
    </script>
</body>
</html>
