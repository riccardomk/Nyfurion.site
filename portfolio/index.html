  <script>
    // AGGRESSIVE BLACK BACKGROUND ENFORCEMENT
    function forceBlackBackground() {
      // Force on html, body, root
      const elements = [document.documentElement, document.body, document.getElementById('root')];
      elements.forEach(el => {
        if (el) {
          el.style.setProperty('background', '#080809', 'important');
          el.style.setProperty('background-color', '#080809', 'important');
          el.style.setProperty('color', '#F2F2F2', 'important');
        }
      });
      
      // Force on all divs that might be containers
      document.querySelectorAll('div, section, footer, header, main, article').forEach(el => {
        const bgColor = window.getComputedStyle(el).backgroundColor;
        if (bgColor === 'rgb(255, 255, 255)' || bgColor === 'white' || bgColor === 'rgba(255, 255, 255, 1)') {
          el.style.setProperty('background-color', '#080809', 'important');
          el.style.setProperty('background', '#080809', 'important');
        }
      });
    }
    
    // Execute immediately
    forceBlackBackground();
    
    // Execute on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', forceBlackBackground);
    }
    
    // Watch for DOM changes with MutationObserver
    const observer = new MutationObserver(forceBlackBackground);
    observer.observe(document.documentElement, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['style', 'class']
    });
    
    // Also run every 100ms for the first 5 seconds
    let count = 0;
    const interval = setInterval(() => {
      forceBlackBackground();
      count++;
      if (count > 50) clearInterval(interval);
    }, 100);
    
    // Run on window load
    window.addEventListener('load', forceBlackBackground);
  </script>
