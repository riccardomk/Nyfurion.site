<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nyfurion Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #0b101a;
        }
        body {
            min-height: 100vh;
        }
        #nyfurion-bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .nyfurion-portal-center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100vw;
            max-width: 100vw;
            box-sizing: border-box;
        }
        .nyfurion-portal-svg-wrap {
            width: 340px; height: 340px;
            pointer-events: auto;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .nyfurion-portal-svg-wrap:focus,
        .nyfurion-portal-svg-wrap:hover {
            filter: drop-shadow(0 0 32px #00eaff88);
        }
        /* Quiz overlay */
        .quiz-overlay {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: rgba(18,22,32,0.97);
            border-radius: 18px;
            box-shadow: 0 0 32px #00eaff55;
            padding: 36px 24px 28px 24px;
            min-width: 320px;
            max-width: 94vw;
            width: 370px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: quizFadeIn 0.7s cubic-bezier(.4,1.6,.4,1);
        }
        @keyframes quizFadeIn {
            from { opacity: 0; transform: translate(-50%, -60%) scale(0.96);}
            to { opacity: 1; transform: translate(-50%, -50%) scale(1);}
        }
        .quiz-title {
            font-family: 'Orbitron', 'Cinzel', serif;
            font-size: 1.35em;
            color: #00eaff;
            text-align: center;
            margin-bottom: 18px;
            letter-spacing: 1px;
            text-shadow: 0 0 12px #1bff6a, 0 0 18px #00eaff44;
        }
        .quiz-progress-bg {
            width: 100%;
            height: 13px;
            background: #232b36;
            border-radius: 8px;
            margin-bottom: 28px;
            overflow: hidden;
            box-shadow: 0 0 8px #00eaff33;
        }
        .quiz-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00eaff 60%, #1bff6a 100%);
            width: 0%;
            transition: width 0.5s cubic-bezier(.4,1.6,.4,1);
            border-radius: 8px;
            box-shadow: 0 0 18px #1bff6a88;
        }
        .quiz-question {
            font-size: 1.08em;
            color: #eaffd0;
            font-family: 'Cinzel', 'Orbitron', serif;
            font-weight: bold;
            text-align: center;
            margin-bottom: 18px;
        }
        .quiz-answers {
            list-style: none;
            padding: 0;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            width: 100%;
        }
        .quiz-answers li { margin-bottom: 0; }
        .quiz-answer-btn {
            width: 100%;
            padding: 13px 0;
            font-size: 1.08em;
            border: 2px solid transparent;
            border-radius: 8px;
            background: linear-gradient(90deg, #00eaff 0%, #1bff6a 100%);
            color: #181a22;
            cursor: pointer;
            transition: background 0.18s, color 0.18s, border 0.18s, box-shadow 0.18s;
            font-family: 'Orbitron', 'Cinzel', Arial, sans-serif;
            font-weight: 600;
            outline: none;
            box-shadow: 0 0 8px #00eaff22;
        }
        .quiz-answer-btn:hover:enabled, .quiz-answer-btn:focus:enabled {
            background: linear-gradient(90deg, #1bff6a 0%, #00eaff 100%);
            color: #fff;
            border: 2px solid #1bff6a;
            box-shadow: 0 0 18px #1bff6a55;
        }
        .quiz-answer-btn.selected {
            border: 2.5px solid #ffe87c;
            background: #008b8b;
            color: #fff;
        }
        .quiz-answer-btn.correct {
            background: #1bff6a;
            color: #181a22;
            border: 2.5px solid #1bff6a;
            box-shadow: 0 0 12px #1bff6a99;
        }
        .quiz-answer-btn.incorrect {
            background: #ff6363;
            color: #fff;
            border: 2.5px solid #ff6363;
            box-shadow: 0 0 12px #ff636399;
        }
        .quiz-answer-btn:disabled:not(.correct):not(.incorrect) {
            background: #232b36;
            color: #bdbdbd;
            border: 2px solid #232b36;
        }
        .quiz-feedback {
            margin-top: 14px;
            font-weight: bold;
            min-height: 26px;
            font-size: 1.08em;
            text-align: center;
            letter-spacing: 0.01em;
        }
        .quiz-score {
            text-align: center;
            font-size: 1.18em;
            margin-top: 22px;
            color: #00eaff;
            font-family: 'Orbitron', 'Cinzel', serif;
            text-shadow: 0 0 12px #1bff6a55;
        }
        .quiz-restart-btn {
            margin-top: 22px;
            background: linear-gradient(90deg,#1bff6a 0%,#00eaff 100%);
            color: #181a22;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 1.08em;
            font-family: 'Orbitron',sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
            box-shadow: 0 0 12px #00eaff33;
        }
        .quiz-restart-btn:hover {
            background: linear-gradient(90deg,#00eaff 0%,#1bff6a 100%);
            color: #fff;
        }
        @media (max-width: 600px) {
            .quiz-overlay {
                min-width: 0;
                width: 97vw;
                padding: 16px 2vw 16px 2vw;
                max-width: 99vw;
                left: 50%;
                top: 52%;
                transform: translate(-50%, -50%);
            }
            .quiz-title { font-size: 1em; }
            .quiz-question { font-size: 0.97em; }
            .quiz-answer-btn { font-size: 0.97em; padding: 10px 0; }
            .quiz-progress-bg { height: 10px; }
            .nyfurion-portal-svg-wrap {
                width: 90vw;
                height: 90vw;
                max-width: 320px;
                max-height: 320px;
            }
            .nyfurion-portal-center {
                width: 100vw;
                max-width: 100vw;
                padding: 0;
            }
            #quiz-strada {
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 18px;
            }
        }
        @media (max-width: 400px) {
            .quiz-overlay {
                padding: 8px 1vw 8px 1vw;
            }
            .nyfurion-portal-svg-wrap {
                width: 98vw;
                height: 98vw;
                max-width: 220px;
                max-height: 220px;
            }
        }
        body {
            overflow-y: auto;
        }
    </style>
</head>

                    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">

                        <stop offset="60%" stop-color="#1bff6a" stop-opacity="0.7"/>
                        <stop offset="100%" stop-color="#181d26" stop-opacity="0"/>

                    <linearGradient id="portalRings" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00eaff"/>
                        <stop offset="100%" stop-color="#1bff6a"/>
                    </linearGradient>

                        <feGaussianBlur stdDeviation="8"/>
                    </filter>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">

                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

    <script>
    // Sfondo animato mistico e avanzato
    (function(){
        const canvas = document.getElementById('nyfurion-bg-canvas');
        if (!canvas) return;
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        const ctx = canvas.getContext('2d');
        let t = 0;
        // Più particelle, colori mistici e scie
        const PARTICLES = Array.from({length: 60}, () => ({
            x: Math.random()*canvas.width,
            y: Math.random()*canvas.height,
            r: 1.5 + Math.random()*3.5,
            color1: `hsla(${180+Math.random()*80},100%,70%,0.7)`,
            color2: `hsla(${120+Math.random()*120},100%,60%,0.3)`,
            speed: 0.2 + Math.random()*0.7,
            angle: Math.random()*Math.PI*2,
            spiral: Math.random()>0.5
        }));
        function drawGlow(x, y, r, color) {
            const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0, color);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI*2);
            ctx.fillStyle = grad;
            ctx.globalAlpha = 0.7;
            ctx.fill();
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            // Onde mistiche
            for(let w=0;w<3;w++){
                ctx.save();
                ctx.globalAlpha = 0.10;
                ctx.beginPath();
                for(let x=0;x<canvas.width;x+=4){
                    let y = canvas.height/2 + Math.sin((x/120)+t/60+w)*60 + Math.cos((x/80)-t/80-w)*30;
                    if(x===0) ctx.moveTo(x,y);
                    else ctx.lineTo(x,y);
                }
                ctx.strokeStyle = `hsla(${180+w*40+t*2},100%,60%,1)`;
                ctx.lineWidth = 18-w*5;
                ctx.shadowColor = `hsla(${180+w*40},100%,60%,1)`;
                ctx.shadowBlur = 32-w*8;
                ctx.stroke();
                ctx.restore();
            }
            // Particelle
            PARTICLES.forEach(p=>{
                // Movimento mistico
                if(p.spiral) {
                    p.angle += 0.008 + p.speed*0.01;
                    p.x += Math.cos(p.angle)*p.speed*2;
                    p.y += Math.sin(p.angle)*p.speed*2;
                } else {
                    p.x += Math.sin(t/30+p.y/99)*p.speed;
                    p.y += Math.cos(t/40+p.x/111)*p.speed*0.5;
                }
                if(p.x<0) p.x=canvas.width;
                if(p.x>canvas.width) p.x=0;
                if(p.y<0) p.y=canvas.height;
                if(p.y>canvas.height) p.y=0;
                // Glow centrale
                drawGlow(p.x, p.y, p.r*7, p.color2);
                // Corpo particella
                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle = p.color1;
                ctx.shadowColor = p.color1;
                ctx.shadowBlur = 18;
                ctx.globalAlpha = 0.85;
                ctx.fill();
                ctx.restore();
                // Scia
                ctx.save();
                ctx.globalAlpha = 0.18;
                ctx.beginPath();
                ctx.arc(p.x-p.speed*8, p.y-p.speed*8, p.r*1.7, 0, Math.PI*2);
                ctx.fillStyle = p.color2;
                ctx.fill();
                ctx.restore();
            });
            // Bagliore radiale mistico
            for(let i=0;i<2;i++){
                let r = canvas.width/2.2 - i*60 + Math.sin(t/40+i)*30;
                drawGlow(canvas.width/2, canvas.height/2, r, `hsla(${180+i*60+t*2},100%,60%,0.10)`);
            }
        }
        function animate() {
            t += 1;
            draw();
            requestAnimationFrame(animate);
        }
        animate();
    })();

    // Cerchio animato
    (function(){
        const ring1 = document.getElementById('ring1');
        const ring2 = document.getElementById('ring2');
        const ring3 = document.getElementById('ring3');
        const lightning = document.getElementById('lightning-main');
        const core = document.getElementById('portal-core');
        const nSymbol = document.getElementById('portal-n-symbol');
        const particlesGroup = document.getElementById('portal-particles');
        let angle = 0, angle2 = 0, angle3 = 0, lightningPhase = 0, pulse = 0;
        function animatePortal() {
            angle += 0.005;
            angle2 -= 0.003;
            angle3 += 0.01;
            lightningPhase += 0.06;
            pulse = 1 + Math.sin(Date.now()/400)*0.07;
            ring1.setAttribute("transform", `rotate(${angle*60} 170 170)`);
            ring2.setAttribute("transform", `rotate(${angle2*60} 170 170)`);
            ring3.setAttribute("transform", `rotate(${angle3*60} 170 170)`);
            let lightningPoints = [
                [170,60],
                [170+Math.sin(lightningPhase)*14, 120],
                [170-Math.cos(lightningPhase/2)*18, 170],
                [170+Math.sin(lightningPhase/1.5)*18, 220],
                [170,280]
            ];
            lightning.setAttribute("points", lightningPoints.map(p=>p.join(",")).join(" "));
            core.setAttribute("r", 38*pulse);
            core.setAttribute("opacity", 0.85+0.12*Math.abs(Math.sin(Date.now()/600)));
            nSymbol.setAttribute("fill", `url(#portalRings)`);
            nSymbol.setAttribute("opacity", 0.85+0.12*Math.abs(Math.cos(Date.now()/700)));
            // Rimuovi particelle orbitanti
            particlesGroup.innerHTML = "";
            requestAnimationFrame(animatePortal);
        }
        animatePortal();
    })();

    // Variabili globali quiz
    let currentQuizIndex = 0;
    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    let bonusPoints = 0;
    let questionStartTime = 0;
    let timerInterval = null;
    const POINTS_PER_CORRECT = 10;

    // Funzione per ottenere il quiz corrente
    function getCurrentQuizData() {
        return allQuizData[currentQuizIndex] || [];
    }

    // Barra di avanzamento quiz
    function updateQuizProgressBar() {
        const quizData = getCurrentQuizData();
        const progress = ((currentQuestion) / quizData.length) * 100;
        document.getElementById('quizProgressBar').style.width = progress + '%';
    }

    // Calcolo bonus risposta rapida
    function calcolaBonus(timeTaken) {
        if (typeof timeTaken !== "number" || isNaN(timeTaken) || timeTaken < 0) return 0;
        if (timeTaken >= 15) return 0;
        let bonus = 10 - Math.floor(timeTaken / 1.5);
        if (bonus < 0) bonus = 0;
        return bonus;
    }

    // Mostra la domanda corrente
    function showQuizQuestion() {
        const quizData = getCurrentQuizData();
        updateQuizProgressBar();
        const quiz = document.getElementById('quiz');
        if (currentQuestion < quizData.length) {
            const q = quizData[currentQuestion];
            quiz.innerHTML = `
                <div class="quiz-question">${q.question}</div>
                <ul class="quiz-answers">
                    ${q.answers.map((ans, idx) => `
                        <li>
                            <button class="quiz-answer-btn" id="ans${idx}" onclick="selectQuizAnswer(${idx})">${ans}</button>
                        </li>
                    `).join('')}
                </ul>
                <div class="quiz-feedback" id="quizFeedback"></div>
            `;
            answered = false;
            questionStartTime = Date.now();
        } else {
            document.getElementById('quizProgressBar').style.width = '100%';
            const maxScore = quizData.length * POINTS_PER_CORRECT;
            const percent = Math.round((score / maxScore) * 100);
            let history = [];
            try { history = JSON.parse(localStorage.getItem('nyfurionQuizHistory') || '[]'); } catch {}
            // NON resettare mai lo storico, aggiungi solo il nuovo tentativo
            history.push({ date: new Date().toISOString(), score, percent, quizIndex: currentQuizIndex });
            localStorage.setItem('nyfurionQuizHistory', JSON.stringify(history));
            saveQuizResultToLeaderboard(percent, score);

            function updateStradaAfterQuiz(percent) {
                let strada = [];
                try { strada = JSON.parse(localStorage.getItem('nyfurionQuizStrada') || '[]'); } catch {}
                if (!strada[currentQuizIndex] || percent > strada[currentQuizIndex].percent) {
                    strada[currentQuizIndex] = { percent, complete: percent === 100 };
                    localStorage.setItem('nyfurionQuizStrada', JSON.stringify(strada));
                }
            }
            updateStradaAfterQuiz(percent);

            quiz.innerHTML = `
                <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
                    <svg width="110" height="110" viewBox="0 0 110 110">
                        <circle cx="55" cy="55" r="48" fill="none" stroke="#232b36" stroke-width="10"/>
                        <circle cx="55" cy="55" r="48" fill="none" stroke="${percent === 100 ? "#1bff6a" : (percent >= 70 ? "#00eaff" : (percent >= 40 ? "#ffe87c" : "#ff6363"))}" stroke-width="10"
                            stroke-dasharray="${2 * Math.PI * 48}"
                            stroke-dashoffset="${2 * Math.PI * 48 * (1 - percent/100)}"
                            style="transition:stroke-dashoffset 1s;"/>
                        <text x="55" y="62" text-anchor="middle" font-size="2em" fill="${percent === 100 ? "#1bff6a" : (percent >= 70 ? "#00eaff" : (percent >= 40 ? "#ffe87c" : "#ff6363"))}" font-family="Orbitron,Arial,sans-serif" font-weight="bold">${percent}%</text>
                    </svg>
                    <div class="quiz-score">Quiz completed!<br>Score: ${score} out of ${maxScore}<br><span style="color:#ffe87c;">Total bonus: ${bonusPoints}</span></div>
                    <div style="margin-top:18px;font-size:0.98em;color:#bafff7;">
                        <b>Attempt history:</b>
                        <ul style="margin:8px 0 0 0;padding:0;list-style:none;">
                            ${history.slice(-5).reverse().map(h =>
                                `<li style="margin-bottom:2px;">${new Date(h.date).toLocaleString('en-GB', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})} - <span style="color:${h.percent===100?'#1bff6a':(h.percent>=70?'#00eaff':(h.percent>=40?'#ffe87c':'#ff6363'))};font-weight:bold;">${h.percent}%</span></li>`
                            ).join('')}
                        </ul>
                    </div>
                </div>
            `;
            if (percent === 100 && allQuizData[currentQuizIndex + 1]) {
                setTimeout(() => {
                    currentQuizIndex++;
                    currentQuestion = 0;
                    score = 0;
                    bonusPoints = 0;
                    showQuizQuestion();
                }, 2000);
            } else {
                setTimeout(() => {
                    document.getElementById('quizOverlay').style.display = 'none';
                    renderQuizStrada();
                    document.getElementById('quiz-strada').style.display = 'flex';
                }, 2000);
            }
        }
    }

    // Seleziona risposta quiz
    window.selectQuizAnswer = function(idx) {
        if (answered) return;
        answered = true;
        clearInterval(timerInterval);
        const q = getCurrentQuizData()[currentQuestion];
        const feedback = document.getElementById('quizFeedback');
        const buttons = document.querySelectorAll('.quiz-answer-btn');
        let timeTaken = (Date.now() - questionStartTime) / 1000;
        let bonus = 0;
        if (idx === q.correct) {
            bonus = calcolaBonus(timeTaken);
            score += POINTS_PER_CORRECT + bonus;
            bonusPoints += bonus;
            feedback.textContent = `Correct! +${POINTS_PER_CORRECT} points${bonus > 0 ? `, +${bonus} bonus` : ', +0 bonus'}`;
            feedback.style.color = "#1bff6a";
        } else {
            feedback.textContent = `Wrong answer. The correct one was: "${q.answers[q.correct]}"`;
            feedback.style.color = "#ff6363";
        }
        buttons.forEach((btn, i) => {
            btn.disabled = true;
            if (i === q.correct) btn.classList.add('correct');
            if (i === idx && i !== q.correct) btn.classList.add('incorrect');
            if (i === idx) btn.classList.add('selected');
        });
        let bonusDiv = document.getElementById('quiz-bonus-points');
        if (!bonusDiv) {
            bonusDiv = document.createElement('div');
            bonusDiv.id = 'quiz-bonus-points';
            bonusDiv.style.marginTop = '8px';
            bonusDiv.style.fontSize = '1.01em';
            bonusDiv.style.color = '#ffe87c';
            bonusDiv.style.fontFamily = "'Orbitron',sans-serif";
            feedback.parentNode.appendChild(bonusDiv);
        }
        bonusDiv.innerHTML = `Accumulated bonus: <b>${bonusPoints}</b>`;
        setTimeout(() => {
            currentQuestion++;
            showQuizQuestion();
        }, 1200);
    };

    // Salva punteggio in classifica (server)
    async function saveQuizResultToLeaderboard(percent, totalScore) {
        // Usa sempre l'indirizzo del wallet come identificativo
        const address = window.nyfWallet || localStorage.getItem('nyfurionWallet') || localStorage.getItem('nyfurionPlayerName') || "Anonymous";
        const quiz = currentQuizIndex + 1;
        const date = new Date().toISOString();
        try {
            await fetch('http://localhost:3002/api/leaderboard', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: address, score: totalScore, percent, quiz, date })
            });
        } catch (e) {
            // fallback locale se il server non è raggiungibile
            let leaderboard = [];
            try { leaderboard = JSON.parse(localStorage.getItem('nyfurionLeaderboard') || '[]'); } catch {}
            leaderboard.push({ name: address, score: totalScore, percent, quiz, date });
            leaderboard = leaderboard.slice(-50);
            localStorage.setItem('nyfurionLeaderboard', JSON.stringify(leaderboard));
        }
    }

    // Chiedi nome utente
    function getOrAskPlayerName() {
        let name = localStorage.getItem('nyfurionPlayerName');
        if (!name) {
            name = prompt("Enter your name for the leaderboard:", "");
            if (name && name.trim().length > 0) {
                localStorage.setItem('nyfurionPlayerName', name.trim());
            } else {
                alert("You must enter a name to participate!");
                return getOrAskPlayerName();
            }
        }
        return name;
    }

    // Avvia quiz
    window.startQuiz = function(i) {
        // Check attempts for this quiz
        let history = [];
        try { history = JSON.parse(localStorage.getItem('nyfurionQuizHistory') || '[]'); } catch {}
        // Count attempts for this quiz index
        const attempts = history.filter(h => h.quizIndex === i).length;
        if (attempts >= 2) {
            alert("You have already completed this quiz twice. No more attempts allowed.");
            return;
        }
        getOrAskPlayerName();
        document.getElementById('quiz-strada').style.display = 'none';
        document.getElementById('quizOverlay').style.display = 'flex';
        currentQuizIndex = i;
        currentQuestion = 0;
        score = 0;
        bonusPoints = 0;
        showQuizQuestion();
    };

    // Chiudi overlay quiz
    function closeQuizOverlay() {
        document.getElementById('quizOverlay').style.display = 'none';
        renderQuizStrada();
        document.getElementById('quiz-strada').style.display = 'flex';
    }
    document.addEventListener('DOMContentLoaded', function() {
        const closeBtn = document.getElementById('quiz-close-btn');
        if (closeBtn) {
            closeBtn.onclick = closeQuizOverlay;
        }
    });

    // Strada quiz rendering
    function renderQuizStrada() {
        let strada = [];
        try { strada = JSON.parse(localStorage.getItem('nyfurionQuizStrada') || '[]'); } catch {}
        let html = '';
        for (let i = 0; i < 5; i++) {
            let stato = strada[i] || { percent: 0, complete: false };
            let color = stato.complete ? "#1bff6a" : (stato.percent >= 70 ? "#00eaff" : (stato.percent >= 40 ? "#ffe87c" : "#232b36"));
            let border = stato.complete ? "#1bff6a" : "#232b36";
            html += `
                <div style="display:flex;flex-direction:column;align-items:center;cursor:pointer;" onclick="startQuiz(${i})">
                    <svg width="70" height="70" viewBox="0 0 70 70">
                        <circle cx="35" cy="35" r="30" fill="#181d26" stroke="${border}" stroke-width="4"/>
                        <circle cx="35" cy="35" r="30" fill="none" stroke="${color}" stroke-width="7"
                            stroke-dasharray="${2 * Math.PI * 30}"
                            stroke-dashoffset="${2 * Math.PI * 30 * (1 - (stato.percent/100))}"
                            style="transition:stroke-dashoffset 1s;"/>
                        ${stato.complete ? `<text x="35" y="44" text-anchor="middle" font-size="2.1em" fill="#1bff6a" font-family="Orbitron,Arial,sans-serif">&#10003;</text>`
                        : `<text x="35" y="44" text-anchor="middle" font-size="1.3em" fill="${color}" font-family="Orbitron,Arial,sans-serif" font-weight="bold">${stato.percent||0}%</text>`}
                    </svg>
                    <div style="font-size:1em;color:#bafff7;margin-top:2px;">Quiz ${i+1}</div>
                </div>
            `;
        }
        document.getElementById('quiz-strada').innerHTML = html;
    }

    // Mostra solo la strada quiz all'avvio
    document.getElementById('quizOverlay').style.display = 'none';
    renderQuizStrada();

    // Carica quiz 6-10 se disponibili
    if (typeof addExtraQuizzesToAllQuizData === "function") {
        addExtraQuizzesToAllQuizData();
    }
    </script>

    // Bottone per accesso wallet
    let walletBtn = document.createElement('button');
    walletBtn.id = 'connect-wallet-btn';
    walletBtn.className = 'nyfurion-wallet-btn';
    walletBtn.innerHTML = `<span class="nyfurion-wallet-label">Connetti Wallet</span>`;
    document.body.appendChild(walletBtn);
    window.initWalletAccess({
        onConnect: function(address, signature) {
            walletBtn.innerHTML = `<span class='nyfurion-wallet-label'>${address.slice(0,6)}...${address.slice(-4)}</span>`;
            walletBtn.disabled = true;
            walletBtn.style.opacity = 0.7;
            window.nyfWallet = address;
        },
        buttonId: 'connect-wallet-btn',
        redirectUrl: window.location.pathname
    });
