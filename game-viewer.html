<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Viewer</title>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #181a22; }
        #game-canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <audio id="mystic-audio" src="assets/mystic-loop.mp3" loop autoplay preload="auto" style="display:none"></audio>
    <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three-stdlib';
    import { PointerLockControls } from 'three-stdlib';
    import { Minimap } from './minimap.js';
    import { loadEnvironmentMap } from './loadEnvironment.js';

    let camera, scene, renderer, controls, velocity, direction, moveForward, moveBackward, moveLeft, moveRight, prevTime;
    let modelBoundingBox = null;
    let groundY = 0;
    let playerRadius = 0.25;
    let eyeHeight = 1.0;
    let modelMesh = null;
    let doors = [];
    let showEDisplay = false;
    let mysticEffects = null;
    let spawnTargetY = null;
    let spawnFalling = false;
    let walkTime = 0;
    let minimap = null;

    function loadModel() {
        const loader = new GLTFLoader();
        loader.load('model.glb', (gltf) => {
            // Centra il modello nella scena
            gltf.scene.position.set(0, 0, 0);
            // Calcola bounding box originale
            const box0 = new THREE.Box3().setFromObject(gltf.scene);
            const size0 = new THREE.Vector3();
            box0.getSize(size0);
            // Scala il modello per dimensioni perfette da videogioco
            let targetHeight;
            if (size0.y > 2.7) {
                targetHeight = 2.7;
            } else if (size0.y < 1.7) {
                targetHeight = 1.7;
            } else {
                targetHeight = size0.y;
            }
            const scale = targetHeight / size0.y;
            gltf.scene.scale.set(scale, scale, scale);
            // Calcola bounding box DOPO la scalatura
            const box = new THREE.Box3().setFromObject(gltf.scene);
            const center = new THREE.Vector3();
            box.getCenter(center);
            const size = new THREE.Vector3();
            box.getSize(size);
            // Sposta il modello in modo che il centro sia (0,0,0)
            gltf.scene.position.set(-center.x, -box.min.y, -center.z);
            scene.add(gltf.scene);
            // Ricalcola bounding box dopo la traslazione
            const boxFinal = new THREE.Box3().setFromObject(gltf.scene);
            const centerFinal = new THREE.Vector3();
            boxFinal.getCenter(centerFinal);
            // Punto di spawn: centro modello, sul pavimento, altezza occhi
            eyeHeight = 1.0;
            const spawn = new THREE.Vector3(
                centerFinal.x,
                boxFinal.min.y + eyeHeight,
                centerFinal.z
            );
            modelBoundingBox = boxFinal;
            groundY = boxFinal.min.y;
            modelMesh = gltf.scene;
            setupDoorsFromModel(gltf.scene);
            addRealisticLighting(scene, renderer, modelMesh);
            updateModelMaterials(modelMesh);
            camera.position.copy(spawn);
            camera.lookAt(centerFinal.x, boxFinal.min.y + eyeHeight, centerFinal.z + 1);
            controls.getObject().position.copy(spawn);
            controls.getObject().lookAt(centerFinal.x, boxFinal.min.y + eyeHeight, centerFinal.z + 1);
            controls.getObject().position.y = boxFinal.min.y + eyeHeight;
            spawnTargetY = spawn.y;
            spawnFalling = true;
            // --- Inizializza o aggiorna la minimappa con il nuovo modello ---
            if (minimap) {
                if (minimap.domElement && minimap.domElement.parentNode) {
                    minimap.domElement.parentNode.removeChild(minimap.domElement);
                }
            }
            minimap = new Minimap(scene, controls.getObject(), modelBoundingBox);
            minimap.initRenderer();
            // ---
            console.log('Spawn point:', spawn);
            console.log('Model center:', centerFinal, 'Model size:', size, 'Model position:', gltf.scene.position);
        }, undefined, (error) => {
            console.error('Errore caricamento modello:', error);
        });
    }

    function createGalleryTexture() {
        // Crea un canvas per la texture
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        // Sfondo muro bianco con leggero rumore
        ctx.fillStyle = '#f5f5f2';
        ctx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < 2000; i++) {
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            const alpha = Math.random() * 0.08 + 0.02;
            ctx.fillStyle = `rgba(200,200,200,${alpha})`;
            ctx.fillRect(x, y, 2, 2);
        }
        // Pavimento tipo parquet nella parte bassa
        ctx.fillStyle = '#e2c48d';
        ctx.fillRect(0, 400, 512, 112);
        for (let i = 0; i < 20; i++) {
            ctx.fillStyle = i % 2 === 0 ? '#d2b47c' : '#e2c48d';
            ctx.fillRect(i * 25, 400, 25, 112);
        }
        // Linea di separazione muro/pavimento
        ctx.strokeStyle = '#bba77a';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 400);
        ctx.lineTo(512, 400);
        ctx.stroke();
        // Crea la texture Three.js
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(2, 2);
        return texture;
    }

    function createModernGalleryTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        // Sfondo mistico: gradiente radiale blu-viola
        const grad = ctx.createRadialGradient(512, 700, 200, 512, 512, 900);
        grad.addColorStop(0, '#b6eaff');
        grad.addColorStop(0.4, '#3a4a7a');
        grad.addColorStop(1, '#181a22');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 1024);
        // Nebbia/Glow soft
        for (let i = 0; i < 8; i++) {
            ctx.save();
            const x = 200 + Math.random() * 624;
            const y = 300 + Math.random() * 500;
            const r = 120 + Math.random() * 180;
            const g = ctx.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, 'rgba(120,200,255,0.13)');
            g.addColorStop(1, 'rgba(120,200,255,0)');
            ctx.globalAlpha = 0.7;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = g;
            ctx.fill();
            ctx.restore();
        }
        // Riflessi soft orizzontali (pavimento)
        for (let i = 0; i < 3; i++) {
            ctx.save();
            const y = 800 + i * 60;
            const grad = ctx.createLinearGradient(0, y, 1024, y);
            grad.addColorStop(0, 'rgba(0,255,247,0.10)');
            grad.addColorStop(0.5, 'rgba(0,255,247,0.22)');
            grad.addColorStop(1, 'rgba(0,255,247,0.10)');
            ctx.fillStyle = grad;
            ctx.globalAlpha = 0.7;
            ctx.fillRect(0, y, 1024, 24);
            ctx.restore();
        }
        // Glow centrale mistico
        ctx.save();
        const cg = ctx.createRadialGradient(512, 400, 0, 512, 400, 220);
        cg.addColorStop(0, 'rgba(0,255,247,0.18)');
        cg.addColorStop(1, 'rgba(0,255,247,0)');
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.arc(512, 400, 220, 0, Math.PI * 2);
        ctx.fillStyle = cg;
        ctx.fill();
        ctx.restore();
        // Ologramma: testo Nyfurion Universe Gallery
        ctx.save();
        ctx.font = 'bold 64px Arial Black, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Glow esterno
        ctx.shadowColor = '#00fff7';
        ctx.shadowBlur = 32;
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = 'rgba(0,255,247,0.85)';
        ctx.fillText('Nyfurion Universe', 512, 320);
        ctx.fillText('Gallery', 512, 400);
        // Effetto olografico: overlay viola/blu
        ctx.globalAlpha = 0.45;
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(120,120,255,0.7)';
        ctx.fillText('Nyfurion Universe', 512, 320);
        ctx.fillText('Gallery', 512, 400);
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText('Nyfurion Universe', 512, 320);
        ctx.fillText('Gallery', 512, 400);
        ctx.restore();
        // Texture Three.js
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(2, 2);
        return texture;
    }

    function applyTextureToModel(model, texturePath) {
        const loader = new THREE.TextureLoader();
        loader.load(texturePath, (texture) => {
            model.traverse((child) => {
                if (child.isMesh && child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(mat => {
                            if (mat.map !== undefined) mat.map = texture;
                            mat.needsUpdate = true;
                        });
                    } else {
                        if (child.material.map !== undefined) child.material.map = texture;
                        child.material.needsUpdate = true;
                    }
                }
            });
        });
    }

    function applyGalleryTextureToModel(model) {
        const texture = createGalleryTexture();
        model.traverse((child) => {
            if (child.isMesh) {
                child.material = new THREE.MeshStandardMaterial({
                    map: texture,
                    color: 0xffffff,
                    metalness: 0.1,
                    roughness: 0.7
                });
                child.material.needsUpdate = true;
            }
        });
    }

    function applyPlanarUVs(geometry, axis = 'y') {
        geometry.computeBoundingBox();
        const bbox = geometry.boundingBox;
        const positions = geometry.attributes.position;
        const uvs = [];
        for (let i = 0; i < positions.count; i++) {
            const x = positions.getX(i);
            const y = positions.getY(i);
            const z = positions.getZ(i);
            let u, v;
            if (axis === 'y') { // proiezione su XZ (pavimento)
                u = (x - bbox.min.x) / (bbox.max.x - bbox.min.x);
                v = (z - bbox.min.z) / (bbox.max.z - bbox.min.z);
            } else { // proiezione su XY (pareti)
                u = (x - bbox.min.x) / (bbox.max.x - bbox.min.x);
                v = (y - bbox.min.y) / (bbox.max.y - bbox.min.y);
            }
            uvs.push(u, v);
        }
        geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    }

    function applyModernGalleryTextureToModel(model) {
        // Applica solo un materiale bianco misto/metallizzato senza texture
        model.traverse((child) => {
            if (child.isMesh && child.geometry) {
                child.material = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    metalness: 0.25,
                    roughness: 0.45,
                    emissive: 0x222244,
                    emissiveIntensity: 0.12
                });
                child.material.needsUpdate = true;
            }
        });
    }

    function removeAllTexturesFromModel(model) {
        model.traverse((child) => {
            if (child.isMesh) {
                child.material = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    metalness: 0.1,
                    roughness: 0.7
                });
                child.material.needsUpdate = true;
            }
        });
    }

    function setupDoorsFromModel(model) {
        doors = [];
        model.traverse((child) => {
            if (child.isMesh && child.name && child.name.startsWith('Door_')) {
                // Crea un pivot per la porta (sul bordo sinistro)
                const bbox = new THREE.Box3().setFromObject(child);
                const size = bbox.getSize(new THREE.Vector3());
                const pivot = new THREE.Object3D();
                // Posiziona il pivot sul bordo sinistro della porta (asse X)
                pivot.position.copy(child.position);
                child.position.set(size.x / 2, 0, 0); // trasla la mesh rispetto al pivot
                pivot.add(child);
                model.add(pivot);
                doors.push({
                    mesh: child,
                    pivot: pivot,
                    open: false,
                    anim: 0 // 0=chiusa, 1=aperta
                });
            }
        });
    }

    function updateDoors(playerPos) {
        let nearAnyDoor = false;
        doors.forEach(door => {
            const dist = door.pivot.position.distanceTo(playerPos);
            if (dist < 1.5) nearAnyDoor = true;
            // Animazione rotazione smooth
            const target = door.open ? Math.PI / 2 : 0;
            door.anim += ((door.open ? 1 : 0) - door.anim) * 0.15;
            door.pivot.rotation.y = target * door.anim;
        });
        showEDisplay = nearAnyDoor && doors.some(d => !d.open);
    }

    // Overlay E stile Nyfurion
    function drawEOverlay() {
        const eDiv = document.getElementById('e-overlay');
        if (!eDiv) return;
        eDiv.style.display = showEDisplay ? 'flex' : 'none';
    }

    function addMysticEffects(scene) {
        mysticEffects = { particles: [], energySpheres: [], lights: [], fog: null, time: 0 };
        // RIMOSSE particelle/lucciole e sfere di energia visibili
        // Luci puntiformi animate (rimangono)
        for (let i = 0; i < 3; i++) {
            const light = new THREE.PointLight(0x00fff7, 0.7, 6, 2);
            light.position.set(
                (Math.random() - 0.5) * 5,
                1.5 + Math.random() * 2,
                (Math.random() - 0.5) * 5
            );
            scene.add(light);
            mysticEffects.lights.push({ light, phase: Math.random() * Math.PI * 2 });
        }
        // Nebbia colorata animata
        scene.fog = new THREE.FogExp2(0x181a22, 0.08);
        mysticEffects.fog = scene.fog;
    }

    function updateMysticEffects() {
        if (!mysticEffects) return;
        mysticEffects.time += 0.016;
        // Luci animate: orbite
        mysticEffects.lights.forEach((l, i) => {
            const t = mysticEffects.time + l.phase;
            l.light.position.x = Math.sin(t * 0.6 + i) * 2.5;
            l.light.position.z = Math.cos(t * 0.7 + i) * 2.5;
            l.light.position.y = 1.5 + Math.sin(t * 1.1 + i) * 0.7;
            l.light.intensity = 0.5 + 0.3 * Math.abs(Math.sin(t * 1.5));
        });
        // Nebbia: colore leggermente animato
        if (mysticEffects.fog) {
            const base = 0x181a22;
            const t = mysticEffects.time;
            const r = 24 + Math.floor(16 * Math.abs(Math.sin(t * 0.2)));
            const g = 26 + Math.floor(24 * Math.abs(Math.sin(t * 0.18 + 1)));
            const b = 34 + Math.floor(32 * Math.abs(Math.sin(t * 0.22 + 2)));
            mysticEffects.fog.color.setRGB(r / 255, g / 255, b / 255);
        }
    }

    function init() {
        camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x181a22);
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Carica environment map HDRI per riflessi e materiali PBR
        loadEnvironmentMap(renderer, scene);
        // Luci professionali PBR
        // AmbientLight solo di complemento
        const ambLight = new THREE.AmbientLight(0xffffff, 0.45); // intensità bassa
        scene.add(ambLight);
        // DirectionalLight molto intensa dall'alto
        const dirLight = new THREE.DirectionalLight(0xffffff, 3.2);
        dirLight.position.set(0, 12, 0);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096;
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.bias = -0.0012;
        dirLight.shadow.radius = 12;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 120;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);
        // SpotLight laterale, fascio stretto, distanza > 100
        const spot = new THREE.SpotLight(0xffffff, 7.5, 160, Math.PI/8, 0.12, 1.3);
        spot.position.set(18, 18, 12);
        spot.target.position.set(0, 0, 0);
        spot.castShadow = true;
        spot.shadow.mapSize.width = 2048;
        spot.shadow.mapSize.height = 2048;
        spot.shadow.bias = -0.001;
        scene.add(spot);
        scene.add(spot.target);
        // HemisphereLight per schiarire ombre
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xf0f0f0, 0.7);
        scene.add(hemiLight);
        // Controlli prima persona
        controls = new PointerLockControls(camera, document.body);
        document.body.addEventListener('click', function() {
            if (!controls.isLocked) controls.lock();
        });
        scene.add(controls.getObject());
        // Movimenti
        velocity = new THREE.Vector3();
        direction = new THREE.Vector3();
        moveForward = moveBackward = moveLeft = moveRight = false;
        prevTime = performance.now();
        document.addEventListener('keydown', function(event) {
            switch(event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'Space':
                    controls.getObject().position.y += 5;
                    break;
            }
        });
        document.addEventListener('keyup', function(event) {
            switch(event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        });
        document.addEventListener('keydown', function(event) {
            // Apertura/chiusura porta con E
            if (event.code === 'KeyE' && showEDisplay) {
                // Apri/chiudi tutte le porte
                const openState = !doors.some(d => d.open);
                doors.forEach(door => {
                    door.open = openState;
                    if (openState) {
                        if (door.anim === 0) {
                            door.anim = 1;
                            door.pivot.rotation.y = Math.PI / 2;
                        }
                    } else {
                        if (door.anim === 1) {
                            door.anim = 0;
                            door.pivot.rotation.y = 0;
                        }
                    }
                });
            }
        });
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        // Carica e posiziona il modello
        loadModel();
        // Avvia la musica mistica in loop (volume basso)
        const audio = document.getElementById('mystic-audio');
        if (audio) {
            audio.volume = 0.18;
            audio.play().catch(() => {});
        }
        // Minimappa: inizializza dopo il caricamento modello
        setTimeout(() => {
            if (!minimap && scene && controls && modelBoundingBox) {
                minimap = new Minimap(scene, controls.getObject(), modelBoundingBox);
                minimap.initRenderer();
            }
        }, 1200);
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now();
        const delta = (time - prevTime) / 1000;
        prevTime = time;
        // Effetto caduta allo spawn
        if (spawnFalling && spawnTargetY !== null) {
            const obj = controls.getObject();
            if (obj.position.y > spawnTargetY) {
                obj.position.y -= Math.max(0.12, (obj.position.y - spawnTargetY) * 0.13);
                if (obj.position.y <= spawnTargetY) {
                    obj.position.y = spawnTargetY;
                    spawnFalling = false;
                }
            } else {
                obj.position.y = spawnTargetY;
                spawnFalling = false;
            }
        }
        // Movimento FPS classico (niente gravità)
        if (!spawnFalling) {
            let move = new THREE.Vector3();
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0; forward.normalize();
            const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
            let isWalking = false;
            if (moveForward) { move.add(forward); isWalking = true; }
            if (moveBackward) { move.add(forward.clone().negate()); isWalking = true; }
            if (moveLeft) { move.add(right.clone().negate()); isWalking = true; }
            if (moveRight) { move.add(right); isWalking = true; }
            move.normalize();
            // Velocità camminata realistica
            const walkSpeed = 0.014;
            move.multiplyScalar(walkSpeed);
            // Collisione mesh-based tramite raycasting
            let canMove = true;
            if (modelMesh && move.lengthSq() > 0) {
                const obj = controls.getObject();
                const rayOrigin = obj.position.clone();
                rayOrigin.y = groundY + eyeHeight;
                const rayDir = move.clone().normalize();
                const raycaster = new THREE.Raycaster(rayOrigin, rayDir, 0, playerRadius + 0.1);
                const intersects = raycaster.intersectObject(modelMesh, true);
                if (intersects.length > 0) {
                    canMove = false;
                }
                if (canMove && modelBoundingBox && !modelBoundingBox.containsPoint(obj.position.clone().add(move))) {
                    canMove = false;
                }
            }
            const obj = controls.getObject();
            if (canMove) {
                obj.position.add(move);
            }
            // Head bobbing: oscillazione verticale durante la camminata
            if (isWalking && move.lengthSq() > 0) {
                walkTime += delta * 7.5;
            } else {
                walkTime = 0;
            }
            const bobbing = isWalking ? Math.sin(walkTime) * 0.045 : 0;
            obj.position.y = groundY + eyeHeight + bobbing;
        }
        // Aggiorna porte
        updateDoors(controls.getObject().position);
        // Aggiorna effetti mistici
        updateMysticEffects();
        // Aggiorna minimappa
        if (minimap) minimap.update();
        // Rendering
        renderer.render(scene, camera);
        // Overlay E
        drawEOverlay();
    }

    // Funzione per illuminazione realistica
    function addRealisticLighting(scene, renderer, modelMesh) {
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.98;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        // Nitidezza texture moderata
        if (renderer.capabilities.getMaxAnisotropy) {
            const medAniso = Math.max(4, Math.floor(renderer.capabilities.getMaxAnisotropy() / 2));
            scene.traverse(obj => {
                if (obj.isMesh && obj.material && obj.material.map) {
                    obj.material.map.anisotropy = medAniso;
                    obj.material.map.minFilter = THREE.LinearMipmapLinearFilter;
                    obj.material.map.magFilter = THREE.LinearFilter;
                    obj.material.map.needsUpdate = true;
                }
            });
        }
        // Nebbia atmosferica
        scene.fog = new THREE.FogExp2(0x181a22, 0.09);
        // Luci principali
        const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 3);
        dirLight.position.set(0, 10, 0);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 4096;
        dirLight.shadow.mapSize.height = 4096;
        dirLight.shadow.bias = -0.0012;
        dirLight.shadow.radius = 12;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 60;
        dirLight.shadow.camera.left = -12;
        dirLight.shadow.camera.right = 12;
        dirLight.shadow.camera.top = 12;
        dirLight.shadow.camera.bottom = -12;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        scene.add(dirLight);
        const spot = new THREE.SpotLight(0xffffff, 5, 120, Math.PI/9, 0.18, 1.2);
        spot.position.set(8, 7, 0);
        spot.target.position.set(0, 0, 0);
        spot.castShadow = true;
        spot.shadow.mapSize.width = 2048;
        spot.shadow.mapSize.height = 2048;
        scene.add(spot);
        scene.add(spot.target);
        // Aggiorna materiali del modello: bianco puro, roughness basso
        if (modelMesh) {
            modelMesh.traverse(child => {
                if (child.isMesh && child.material) {
                    let mat = child.material;
                    if (Array.isArray(mat)) {
                        mat.forEach(m => {
                            if (m.map) {
                                // Verifica che la texture sia bianca
                                m.color = new THREE.Color(0xffffff);
                            }
                            m.roughness = 0.2;
                            m.metalness = 0.1;
                            m.needsUpdate = true;
                        });
                    } else {
                        if (mat.map) {
                            mat.color = new THREE.Color(0xffffff);
                        }
                        mat.roughness = 0.2;
                        mat.metalness = 0.1;
                        mat.needsUpdate = true;
                    }
                }
            });
        }
    }

    function updateModelMaterials(model) {
    model.traverse((child) => {
        if (child.isMesh) {
            // Parametri base
            let baseColor = (child.material && child.material.color) ? child.material.color : new THREE.Color(0xffffff);
            let roughness = (child.material && typeof child.material.roughness === 'number') ? child.material.roughness : 0.13;
            let metalness = (child.material && typeof child.material.metalness === 'number') ? child.material.metalness : 0.32;
            let envIntensity = 0.82;
            let clearcoat = 0.38;
            let clearcoatRoughness = 0.09;
            let sheen = 0.18;
            let sheenColor = new THREE.Color(0xf0f0ff);
            let ior = (child.material && typeof child.material.ior === 'number') ? child.material.ior : 1.48;
            let transmission = (child.material && typeof child.material.transmission === 'number') ? child.material.transmission : 0.0;
            let opacity = (child.material && typeof child.material.opacity === 'number') ? child.material.opacity : 1.0;
            let thickness = (child.material && typeof child.material.thickness === 'number') ? child.material.thickness : 0.01;
            let map = (child.material && child.material.map) ? child.material.map : null;
            // Se il materiale esportato ha trasparenza o transmission, applica effetto vetro
            let isTransparent = (opacity < 0.98 || transmission > 0.05);
            child.material = new THREE.MeshPhysicalMaterial({
                color: baseColor,
                map: map,
                roughness: roughness,
                metalness: metalness,
                envMapIntensity: envIntensity,
                clearcoat: clearcoat,
                clearcoatRoughness: clearcoatRoughness,
                sheen: sheen,
                sheenColor: sheenColor,
                ior: isTransparent ? Math.max(ior, 1.45) : ior,
                transmission: isTransparent ? Math.max(transmission, 0.85) : transmission,
                thickness: isTransparent ? Math.max(thickness, 0.18) : thickness,
                opacity: opacity,
                transparent: isTransparent,
                premultipliedAlpha: isTransparent,
                reflectivity: 0.62,
                specularIntensity: 0.48,
                specularColor: new THREE.Color(0xffffff),
            });
            // Migliora la nitidezza delle texture
            if (child.material.map) {
                const medAniso = renderer && renderer.capabilities.getMaxAnisotropy ? Math.max(4, Math.floor(renderer.capabilities.getMaxAnisotropy() / 2)) : 4;
                child.material.map.anisotropy = medAniso;
                child.material.map.minFilter = THREE.LinearMipmapLinearFilter;
                child.material.map.magFilter = THREE.LinearFilter;
                child.material.map.needsUpdate = true;
            }
            child.material.needsUpdate = true;
        }
    });
    }

    init();
    animate();
    </script>
    <!-- Overlay E (interazione porte) -->
    <div id="e-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
            <span style="font-family: Arial, sans-serif; font-size: 24px; color: #00fff7; text-shadow: 0 0 10px rgba(0,255,247,0.7);">Premi E per interagire</span>
        </div>
    </div>
</body>
</html>
