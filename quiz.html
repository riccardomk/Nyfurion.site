<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Nyfurion Portal Experience</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: #101214;
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            color: #eaf2f1;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: invert-colors 5s linear infinite; /* aumentata la durata */
        }
        @keyframes invert-colors {
            0%, 100% {
                background: #101214;
                color: #eaf2f1;
            }
            50% {
                background: #fff;
                color: #101214;
            }
        }
        .nyfurion-bg-text {
            position: fixed;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8vw;
            font-weight: 900;
            color: #23272b;
            opacity: 0.10;
            letter-spacing: 0.13em;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            white-space: nowrap;
            text-transform: uppercase;
            font-family: 'Orbitron', 'Inter', 'Segoe UI', Arial, sans-serif;
            animation: invert-bg-text 5s linear infinite; /* aumentata la durata */
        }
        @keyframes invert-bg-text {
            0%, 100% {
                color: #eaf2f1; /* bianco opaco */
                opacity: 0.13;
            }
            50% {
                color: #000;
                opacity: 1;
            }
        }
        .nyfurion-center-section {
            display: flex;
            flex-direction: row;
            gap: 2.5em;
            justify-content: center;
            align-items: center;
            margin-top: 7em;
            position: relative;
            z-index: 1;
        }
        .nyfurion-card {
            background: #181a1b;
            border-radius: 18px;
            box-shadow: none;
            padding: 1.3em 2em;
            min-width: 160px;
            min-height: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            border: 1.5px solid #23272b;
            animation: invert-card 5s linear infinite; /* aumentata la durata */
        }
        @keyframes invert-card {
            0%, 100% {
                background: #181a1b;
                border-color: #23272b;
            }
            50% {
                background: #fff;
                border-color: #101214;
            }
        }
        .nyfurion-card-title {
            font-size: 1.15em;
            font-weight: 600;
            color: #eaf2f1;
            letter-spacing: 0.01em;
            text-align: center;
            animation: invert-card-title 5s linear infinite; /* aumentata la durata */
        }
        @keyframes invert-card-title {
            0%, 100% {
                color: #eaf2f1;
            }
            50% {
                color: #101214;
            }
        }
        .nyfurion-card:hover {
            background: #23272b;
            border-color: #2ec4b6;
            transform: scale(1.06) translateY(-6px);
            box-shadow: 0 8px 32px 0 rgba(46,196,182,0.18);
        }
        .nyfurion-card:active {
            transform: scale(0.98) translateY(2px);
            box-shadow: 0 2px 8px 0 rgba(46,196,182,0.10);
        }
        .nyfurion-card:focus {
            outline: 2px solid #2ec4b6;
            outline-offset: 2px;
        }
        @media (max-width: 900px) {
            .nyfurion-center-section {
                flex-direction: column;
                gap: 2.2em;
                width: 90vw;
                margin: 0 auto;
                margin-top: 2.5em;
                align-items: center;
            }
            .nyfurion-bg-text {
                font-size: 2.5em;
                top: 18%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100vw;
                text-align: center;
            }
            .nyfurion-card {
                min-width: 0;
                width: 90vw;
                max-width: 340px;
                min-height: 70px;
                margin: 0 auto;
                font-size: 1em;
            }
            .nyfurion-card-title {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="nyfurion-bg-text">Nyfurion</div>
    <div class="nyfurion-center-section">
        <div class="nyfurion-card" onclick="window.open('community.html','_blank')">
            <div class="nyfurion-card-title">Community</div>
        </div>
        <div class="nyfurion-card" onclick="window.open('club-prime.html','_self')">
            <div class="nyfurion-card-title">Club</div>
        </div>
    </div>
</body>
</html>
