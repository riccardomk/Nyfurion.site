<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frammento VIII - La Profezia del Vuoto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(rgba(8,8,9,0.85), rgba(8,8,9,0.85)), url('books-bg.png');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      min-height: 100vh;
      line-height: 1.8;
    }
    h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 13, 14, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1.5rem 2rem;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #E30B17;
    }
    .back-btn {
      padding: 0.75rem 1.5rem;
      background: #0D0D0E;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #F2F2F2;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s;
      border-radius: 2px;
    }
    .back-btn:hover {
      border-color: #E30B17;
      color: #E30B17;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 9rem 2rem 5rem;
    }
    .fragment-title {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
      background: linear-gradient(to bottom, #ffffff, #a0a0a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .fragment-content {
      background: rgba(13, 13, 14, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 3rem;
      margin-top: 2rem;
      font-size: 1.1rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">Frammento VIII</div>
    <a href="profezia-del-vuoto.html" class="back-btn">← Torna alla Profezia</a>
  </header>
  
  <div class="container">
    <h1 class="fragment-title">Frammento VIII</h1>
    <div class="fragment-content">
      <p>Contenuto dell'ottavo frammento della profezia...</p>
    </div>
  </div>
</body>
</html>
